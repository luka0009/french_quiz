wers":[],"choices":null}],"verification":null,"match":null,"answers":{"confidence":"reference","explanation":null,"reference":"Il a été interdit par les autorités que l'on pêche dans les eaux territoriales."}}]}]},{"id":"ch14","number":14,"title":"LE DISCOURS INDIRECT","exercises":[{"id":"14-e01","label":"1","suffix":null,"type":"transformation","instruction":"Transformez ces interrogations en interrogations indirectes en essayant de varier les verbes introducteurs comme dans l’exemple.","context":null,"word_bank":null,"gradable":false,"section":"Le discours indirect","items":[{"id":"14-e01.1","context":null,"prompt":"Quand est-ce que vous irez à Pau ?","gradable":false,"blanks":[],"verification":null,"match":null,"answers":{"confidence":"reference","explanation":null,"reference":"Je me demande quand vous irez à Pau."}},{"id":"14-e01.2","context":null,"prompt":"Pourquoi vous vous disputez ?","gradable":false,"blanks":[],"verification":null,"match":null,"answers":{"confidence":"reference","explanation":null,"reference":"Je voudrais savoir pourquoi vous vous disputez."}},{"id":"14-e01.3","context":null,"prompt":"Comment iras-tu à l’aéroport ?","gradable":false,"blanks":[],"verification":null,"match":null,"answers":{"confidence":"reference","explanation":null,"reference":"Peux-tu me dire comment tu iras à l’aéroport ?"}},{"id":"14-e01.4","context":null,"prompt":"Qu’est-ce qui la rend triste ?","gradable":false,"blanks":[],"verification":null,"match":null,"answers":{"confidence":"reference","explanation":null,"reference":"Je ne sais pas ce qui la rend triste."}},{"id":"14-e01.5","context":null,"prompt":"Qu’est-ce qu’on fait ce soir ?","gradable":false,"blanks":[],"verification":null,"match":null,"answers":{"confidence":"reference","explanation":null,"reference":"Dites-moi ce qu’on fait ce soir."}},{"id":"14-e01.6","context":null,"prompt":"Où est-ce qu’il est parti ?","gradable":false,"blanks":[],"verification":null,"match":null,"answers":{"confidence":"reference","explanation":null,"reference":"J’ignore où il est parti."}},{"id":"14-e01.7","context":null,"prompt":"Avec qui partez-vous en vacances ?","gradable":false,"blanks":[],"verification":null,"match":null,"answers":{"confidence":"reference","explanation":null,"reference":"Il nous demande avec qui nous partons en vacances."}},{"id":"14-e01.8","context":null,"prompt":"Est-ce que tu as compris ?","gradable":false,"blanks":[],"verification":null,"match":null,"answers":{"confidence":"reference","explanation":null,"reference":"Elle veut savoir si j’ai compris."}},{"id":"14-e01.9","context":null,"prompt":"Laquelle préfères-tu ?","gradable":false,"blanks":[],"verification":null,"match":null,"answers":{"confidence":"reference","explanation":null,"reference":"Il me demande laquelle je préfère."}},{"id":"14-e01.10","context":null,"prompt":"Quel cadeau lui ferait plaisir ?","gradable":false,"blanks":[],"verification":null,"match":null,"answers":{"confidence":"reference","explanation":null,"reference":"Je me demande quel cadeau lui ferait plaisir."}},{"id":"14-e01.11","context":null,"prompt":"Êtes-vous prêts ?","gradable":false,"blanks":[],"verification":null,"match":null,"answers":{"confidence":"reference","explanation":null,"reference":"Elle nous demande si nous sommes prêts."}}]},{"id":"14-e02","label":"2","suffix":null,"type":"fill_blank","instruction":"Transformez les impératifs au discours indirect en utilisant le mode qui convient.","context":null,"word_bank":null,"gradable":true,"section":"Le discours indirect","items":[{"id":"14-e02.1","context":null,"prompt":"Répondez avant jeudi ! Il demande ___. – Il demande que ___","gradable":true,"blanks":[{"id":"b1","answers":["de répondre avant jeudi"],"choices":null},{"id":"b2","answers":["vous répondiez avant jeudi"],"choices":null}],"verification":{"status":"verified","note":"confirmé après arbitrage"},"match":null,"answers":{"confidence":"unanimous","explanation":"Après un verbe de demande comme « demander », on emploie « de + infinitif » quand le sujet reste le même ; avec « que », on met le verbe au subjonctif (« que vous répondiez »), car « demander que » exprime un ordre ou un souhait.","reference":null}},{"id":"14-e02.2","context":null,"prompt":"Parle plus fort ! Il lui dit ___. – Il veut que ___","gradable":true,"blanks":[{"id":"b1","answers":["de parler plus fort"],"choices":null},{"id":"b2","answers":["tu parles plus fort"],"choices":null}],"verification":{"status":"suspect","note":"trou b2 : ni « tu parles plus fort » ni « qu'il parle plus fort » ne conviennent, l'arbitre attend « il parle plus fort » — Le sujet doit être à la troisième personne ('il') car on rapporte un ordre adressé à 'lui' ; de plus, on ne répète pas 'que'."},"match":null,"answers":{"confidence":"unanimous","explanation":null,"reference":null}},{"id":"14-e02.3","context":null,"prompt":"Partez avant midi ! Elle suggère ___. – Elle suggère que ___","gradable":true,"blanks":[{"id":"b1","answers":["de partir avant midi"],"choices":null},{"id":"b2","answers":["vous partiez avant midi"],"choices":null}],"verification":{"status":"verified","note":"confirmé après arbitrage"},"match":null,"answers":{"confidence":"unanimous","explanation":"« Suggérer » peut se construire avec « de + infinitif » ou avec « que + subjonctif » (« que vous partiez »), le subjonctif étant obligatoire après « que ».","reference":null}},{"id":"14-e02.4","context":null,"prompt":"Allons-y ensemble ! Il propose ___. – Il propose que ___","gradable":true,"blanks":[{"id":"b1","answers":["d’y aller ensemble"],"choices":null},{"id":"b2","answers":["nous y allions ensemble"],"choices":null}],"verification":{"status":"verified","note":"confirmé après arbitrage"},"match":null,"answers":{"confidence":"unanimous","explanation":"« Proposer » accepte « de + infinitif » (« d'y aller ensemble ») ou « que + subjonctif » (« que nous y allions ») ; le pronom « y » remplace le lieu et se place avant l'infinitif.","reference":null}},{"id":"14-e02.5","context":null,"prompt":"Arrêtez de crier ! Elle dit ___. – Elle demande que ___","gradable":true,"blanks":[{"id":"b1","answers":["d’arrêter de crier"],"choices":null},{"id":"b2","answers":["vous arrêtiez de crier"],"choices":null}],"verification":{"status":"verified","note":"confirmé après arbitrage"},"match":null,"answers":{"confidence":"unanimous","explanation":"Avec « dire » et « demander » rapportant un ordre, on utilise « de + infinitif » (« d'arrêter de crier ») ou « que + subjonctif » (« que vous arrêtiez »).","reference":null}},{"id":"14-e02.6","context":null,"prompt":"Rangez vos affaires ! Elle nous demande ___. – Elle veut que ___","gradable":true,"blanks":[{"id":"b1","answers":["de ranger nos affaires"],"choices":null},{"id":"b2","answers":["nous rangions nos affaires"],"choices":null}],"verification":{"status":"verified","note":"confirmé après arbitrage"},"match":null,"answers":{"confidence":"unanimous","explanation":"« Demander » et « vouloir » introduisent ici un ordre adressé à « nous » : on emploie « de + infinitif » (« de ranger nos affaires ») ou « que + subjonctif » (« que nous rangions »).","reference":null}},{"id":"14-e02.7","context":null,"prompt":"Dépêchez-vous ! Il dit ___. – Il veut que ___","gradable":true,"blanks":[{"id":"b1","answers":["de se dépêcher"],"choices":null},{"id":"b2","answers":["vous vous dépêchiez"],"choices":null}],"verification":{"status":"verified","note":"confirmé après arbitrage"},"match":null,"answers":{"confidence":"unanimous","explanation":"Le verbe pronominal « se dépêcher » garde son pronom à l'infinitif (« de se dépêcher ») ; au subjonctif après « vouloir que », on écrit « que vous vous dépêchiez ».","reference":null}}]},{"id":"14-e03","label":"3","suffix":null,"type":"fill_blank","instruction":"Transformez ces phrases au discours indirect en faisant les changements de pronoms et d’adjectifs qui conviennent.","context":null,"word_bank":null,"gradable":true,"section":"Le discours indirect","items":[{"id":"14-e03.1","context":null,"prompt":"Est-ce que tu peux me prêter ton vélo ? – Elle demande ___","gradable":true,"blanks":[{"id":"b1","answers":["si je peux lui prêter mon vélo"],"choices":null}],"verification":{"status":"verified","note":null},"match":null,"answers":{"confidence":"unanimous","explanation":"Une question totale (oui/non) au discours indirect est introduite par « si » ; « me » devient « lui » (la personne qui parle) et « ton vélo » devient « mon vélo » (le locuteur d'origine).","reference":null}},{"id":"14-e03.2","context":null,"prompt":"Quand est-ce que vous viendrez me voir ? – Il veut savoir ___","gradable":true,"blanks":[{"id":"b1","answers":["quand nous viendrons le voir","quand vous viendrez le voir","quand ils viendront le voir"],"choices":null}],"verification":{"status":"verified","note":"deux formes acceptables (aucune faute établie) : « quand nous viendrons le voir » conservé en tête ; 1 variante(s) ajoutée(s)"},"match":null,"answers":{"confidence":"arbitrated","explanation":"Une question partielle garde le mot interrogatif « quand » sans inversion ; « vous » devient « nous » et « me » devient « le » (il → le).","reference":null}},{"id":"14-e03.3","context":null,"prompt":"J’ai laissé mes clés dans ta voiture. – Il me dit ___","gradable":true,"blanks":[{"id":"b1","answers":["qu’il a laissé ses clés dans ma voiture"],"choices":null}],"verification":{"status":"verified","note":null},"match":null,"answers":{"confidence":"unanimous","explanation":"C'est une déclaration introduite par « que » ; « j' » (celui qui parle) devient « il », « mes clés » devient « ses clés » et « ta voiture » devient « ma voiture ».","reference":null}},{"id":"14-e03.4","context":null,"prompt":"Où est-ce que j’ai pu oublier mes lunettes ? – Elle se demande ___","gradable":true,"blanks":[{"id":"b1","answers":["où elle a pu oublier ses lunettes"],"choices":null}],"verification":{"status":"verified","note":null},"match":null,"answers":{"confidence":"unanimous","explanation":"Question partielle avec « où » conservé ; « j' » devient « elle » et « mes lunettes » devient « ses lunettes ».","reference":null}},{"id":"14-e03.5","context":null,"prompt":"J’ai rencontré ta sœur devant chez moi. – Il dit ___","gradable":true,"blanks":[{"id":"b1","answers":["qu’il a rencontré ma sœur devant chez lui"],"choices":null}],"verification":{"status":"verified","note":null},"match":null,"answers":{"confidence":"unanimous","explanation":"Déclaration introduite par « que » ; « j' » devient « il », « ta sœur » devient « ma sœur » et « chez moi » devient « chez lui ».","reference":null}},{"id":"14-e03.6","context":null,"prompt":"Est-ce que vous pourrez m’accompagner ? – Elle ne sait pas ___","gradable":true,"blanks":[{"id":"b1","answers":["si nous pourrons l'accompagner","si vous pourrez l’accompagner","s’ils pourront l’accompagner"],"choices":null}],"verification":{"status":"verified","note":"deux formes acceptables (aucune faute établie) : « si nous pourrons l'accompagner » conservé en tête ; 1 variante(s) ajoutée(s)"},"match":null,"answers":{"confidence":"arbitrated","explanation":"Question totale introduite par « si » ; « vous » devient « nous » et « m' » devient « l' » (elle → l').","reference":null}},{"id":"14-e03.7","context":null,"prompt":"Pourrais-tu me prêter le tien ? – Elle demande ___","gradable":false,"blanks":[{"id":"b1","answers":["de lui prêter le sien","si je peux lui prêter le mien"],"choices":null}],"verification":null,"match":null,"answers":{"confidence":"low","explanation":null,"reference":null}},{"id":"14-e03.8","context":null,"prompt":"Où avez-vous rangé ma veste ? – Il veut savoir ___","gradable":true,"blanks":[{"id":"b1","answers":["où vous avez rangé sa veste","où nous avons rangé sa veste","où ils ont rangé sa veste"],"choices":null}],"verification":{"status":"verified","note":"deux formes acceptables (aucune faute établie) : « où vous avez rangé sa veste » conservé en tête ; 1 variante(s) ajoutée(s)"},"match":null,"answers":{"confidence":"arbitrated","explanation":"Question partielle avec « où » conservé ; « vous » reste « vous » et « ma veste » devient « sa veste » (la veste de celui qui parle, il).","reference":null}}]},{"id":"14-e04","label":"1","suffix":null,"type":"fill_blank","instruction":"Rapporter les déclarations suivantes en écrivant un article dans un journal ; variez les verbes introducteurs.","context":null,"word_bank":null,"gradable":true,"section":"La concordance des temps","items":[{"id":"14-e04.1","context":null,"prompt":"Au tribunal l'accusé affirme : « Je n'ai pas tué le caissier et je n'ai pas emporté les lingots d'or ; je n'ai pas volé la voiture du directeur pour une simple raison : j'étais venu encaisser un chèque et je suis rentré en métro... »\nLe journal Ouest-France rend compte du procès :\nL'accusé affirme ___","gradable":true,"blanks":[{"id":"b1","answers":["qu’il n’a pas tué le caissier et qu’il n’a pas emporté les lingots d’or ; qu’il n’a pas volé la voiture du directeur pour une simple raison : il était venu encaisser un chèque et il est rentré en métro...","qu’il n’a pas tué le caissier, qu’il n’a pas emporté les lingots d’or et qu’il n’a pas volé la voiture du directeur pour une simple raison : il était venu encaisser un chèque et il est rentré en métro","qu'il n'a pas tué le caissier, qu'il n'a pas emporté les lingots d'or et qu'il n'a pas volé la voiture du directeur, pour la simple raison qu'il était venu encaisser un chèque et qu'il est rentré en métro","qu'il n'a pas tué le caissier, qu'il n'a pas emporté les lingots d'or, qu'il n'a pas volé la voiture du directeur, pour une simple raison : il était venu encaisser un chèque et il est rentré en métro"],"choices":null}],"verification":{"status":"verified","note":"deux formes acceptables (aucune faute établie) : « qu’il n’a pas tué le caissier et qu’il n’a pas emporté les lingots d’or ; qu’il n’a pas volé la voiture du directeur pour une simple raison : il était venu encaisser un chèque et il est rentré en métro... » conservé en tête ; 2 variante(s) ajoutée(s)"},"match":null,"answers":{"confidence":"arbitrated","explanation":"Le verbe introducteur « affirme » est au présent : la concordance des temps n'exige donc aucun changement de temps, et le passé composé (« je n'ai pas tué », « j'ai pas emporté », « j'ai pas volé ») reste au passé composé. Seules les personnes changent (« je » devient « il ») et les propositions sont reliées par « que » ; l'imparfait (« j'étais venu ») et le passé composé (« je suis rentré ») sont également conservés tels quels.","reference":null}}]},{"id":"14-e05","label":"2","suffix":null,"type":"open","instruction":"Rapportez à un ami le contenu de cette lettre que vous venez de recevoir en faisant toutes les transformations nécessaires et en variant les verbes introducteurs.","context":null,"word_bank":null,"gradable":false,"section":"La concordance des temps","items":[{"id":"14-e05.1","context":null,"prompt":"Chère Isabelle,\nJe t'écris de Cuzco où je suis enfin arrivé après un voyage épuisant. Nous avons dû faire une escale technique à Asunción, ce qui m'a permis de voir les chutes du Paraná. C'était grandiose ! Comme il n'y avait pas de quoi réparer le réacteur nous avons attendu dans un hall non climatisé, sans rien à boire ni à manger. L'horreur pendant 6 heures ! Enfin nous avons pu repartir avant d'être morts de faim et de soif. À l'arrivée j'aurais voulu aller me coucher sans attendre mais comme le Consul était venu nous chercher je n'ai pas pu refuser son invitation à dîner. Tu vas être surprise d'apprendre que pendant cette soirée j'ai revu notre ami Jean-Christian... Je te raconterai tout ça dans ma prochaine lettre.\nPierre\n\nJ'ai reçu il y a un mois une lettre de Pierre dans laquelle il me disait qu'il ___","gradable":false,"blanks":[{"id":"b1","answers":[],"choices":null}],"verification":null,"match":null,"answers":{"confidence":"reference","explanation":null,"reference":"J'ai reçu il y a un mois une lettre de Pierre dans laquelle il me disait qu'il m'écrivait de Cuzco, où il était enfin arrivé après un voyage épuisant. Ils avaient dû faire une escale technique à Asunción, ce qui lui avait permis de voir les chutes du Paraná ; c'était grandiose. Comme il n'y avait pas de quoi réparer le réacteur, ils avaient attendu dans un hall non climatisé, sans rien à boire ni à manger — l'horreur pendant six heures ! Enfin ils avaient pu repartir avant d'être morts de faim et de soif. À l'arrivée, il aurait voulu aller se coucher sans attendre, mais comme le Consul était venu les chercher, il n'avait pas pu refuser son invitation à dîner. J'allais être surprise d'apprendre que, pendant cette soirée, il avait revu notre ami Jean-Christian... Il me raconterait tout ça dans sa prochaine lettre."}}]},{"id":"14-e07","label":"1","suffix":null,"type":"fill_blank","instruction":"Complétez ce texte par les expressions de temps qui conviennent.","context":"Souvenir de la victoire de Marie-José Pérec aux 400 mètres aux jeux Olympiques d’Atlanta.","word_bank":null,"gradable":true,"section":"Le discours indirect libre","items":[{"id":"14-e07.1","context":"Souvenir de la victoire de Marie-José Pérec aux 400 mètres aux jeux Olympiques d’Atlanta.","prompt":"La course devait avoir lieu en fin d’après-midi sur le grand stade d’Atlanta. Ce matin-là, Marie-Jo s’était réveillée de bonne heure car ___ elle s’était couchée tôt, comme elle l’avait fait tous les ___. Vers 5 heures, elle s’était présentée sur la piste sûre d’elle-même, confiante dans ses possibilités. Après la course, ___ elle avait téléphoné à sa grand-mère restée aux Antilles, pour lui faire partager sa joie. ___ elle s’était réveillée en se demandant ce qui lui était arrivé ___. Puis tout au long de cette ___, elle avait eu l’impression de marcher sur un nuage. Que cette médaille d’or était belle !","gradable":true,"blanks":[{"id":"b1","answers":["la veille au soir","la veille"],"choices":null},{"id":"b2","answers":["soirs"],"choices":null},{"id":"b3","answers":["le soir même","ce soir-là"],"choices":null},{"id":"b4","answers":["Le lendemain matin","Le lendemain"],"choices":null},{"id":"b5","answers":["la veille"],"choices":null},{"id":"b6","answers":["journée"],"choices":null}],"verification":{"status":"verified","note":"1 variante(s) ajoutée(s)"},"match":null,"answers":{"confidence":"arbitrated","explanation":"Dans un récit au passé, « la veille au soir » situe l'action le soir du jour précédent, par rapport au « ce matin-là » du récit ; « tous les soirs » exprime l'habitude passée avec la marque du pluriel. « Le soir même » renvoie au soir du jour dont on parle (le jour de la course), « le lendemain matin » au matin du jour suivant, et « la veille » au jour précédent. Enfin, « cette journée » désigne la durée complète du jour vécu, ce qui convient après « tout au long de ».","reference":null}}]},{"id":"14-e08","label":"2","suffix":null,"type":"open","instruction":"Complétez ce récit en utilisant le contenu de la lettre ; faites les transformations nécessaires.","context":null,"word_bank":null,"gradable":false,"section":"Le discours indirect libre","items":[{"id":"14-e08.1","context":null,"prompt":"Ce jour-là, il était arrivé tard dans la soirée. Il était monté directement dans sa chambre où il avait trouvé une lettre de la Marquise de D. Il l’avait ouverte aussitôt...\nCher ami,\nVenez demain au château vers cinq heures. Je vous y attendrai. J’ai aperçu hier notre ami Charles de... qui m’a fait part de son inquiétude de devoir quitter le pays le mois prochain. Je vous raconterai tout dans les détails... J’ai promis à Charles de lui donner le résultat de notre entretien dès après-demain. Soyez au rendez-vous, je vous en prie.\nVotre fidèle amie,\nIl l’avait ouverte aussitôt. La marquise lui ___","gradable":false,"blanks":[{"id":"b1","answers":[],"choices":null}],"verification":null,"match":null,"answers":{"confidence":"reference","explanation":null,"reference":"Ce jour-là, il était arrivé tard dans la soirée. Il était monté directement dans sa chambre où il avait trouvé une lettre de la Marquise de D. Il l’avait ouverte aussitôt...\nCher ami,\nVenez demain au château vers cinq heures. Je vous y attendrai. J’ai aperçu hier notre ami Charles de... qui m’a fait part de son inquiétude de devoir quitter le pays le mois prochain. Je vous raconterai tout dans les détails... J’ai promis à Charles de lui donner le résultat de notre entretien dès après-demain. Soyez au rendez-vous, je vous en prie.\nVotre fidèle amie,\nIl l’avait ouverte aussitôt. La marquise lui demandait de venir le lendemain au château vers cinq heures ; elle l’y attendrait ; elle avait aperçu la veille leur ami Charles de... qui lui avait fait part de son inquiétude de devoir quitter le pays le mois suivant ; elle lui raconterait tout dans les détails ; elle avait promis à Charles de lui donner le résultat de leur entretien dès le surlendemain ; elle le priait d’être au rendez-vous."}}]},{"id":"14-e09","label":"3","suffix":null,"type":"open","instruction":"Rapportez cette communication téléphonique à un ami en faisant attention au lien avec le présent :","context":null,"word_bank":null,"gradable":false,"section":"Le discours indirect libre","items":[{"id":"14-e09.1","context":null,"prompt":"Allô Frédéric – J’arriverai demain matin à Charles-de-Gaulle – Je passerai la matinée à la Bibliothèque nationale – En fin de matinée, je déjeunerai avec le professeur Godant – En début d’après-midi, j’irai voir mon éditeur – En fin d’après midi, j’aurai encore quelques rendez-vous mais nous pourrions nous voir après cela vers 19 h 30 – Après, en fin de soirée, je reprendrai mon avion pour Madrid.\nPierre m’a téléphoné ce matin pour ___","gradable":false,"blanks":[{"id":"b1","answers":[],"choices":null}],"verification":null,"match":null,"answers":{"confidence":"reference","explanation":null,"reference":"Allô Frédéric – J’arriverai demain matin à Charles-de-Gaulle – Je passerai la matinée à la Bibliothèque nationale – En fin de matinée, je déjeunerai avec le professeur Godant – En début d’après-midi, j’irai voir mon éditeur – En fin d’après midi, j’aurai encore quelques rendez-vous mais nous pourrions nous voir après cela vers 19 h 30 – Après, en fin de soirée, je reprendrai mon avion pour Madrid.\nPierre m’a téléphoné ce matin pour m’annoncer qu’il arriverait le lendemain matin à Charles-de-Gaulle, qu’il passerait la matinée à la Bibliothèque nationale, qu’en fin de matinée il déjeunerait avec le professeur Godant, qu’en début d’après-midi il irait voir son éditeur, qu’en fin d’après-midi il aurait encore quelques rendez-vous mais que nous pourrions nous voir après cela vers 19 h 30 et qu’ensuite, en fin de soirée, il reprendrait son avion pour Madrid."}}]}]},{"id":"ch15","number":15,"title":"L'ADVERBE","exercises":[{"id":"15-e01","label":"1","suffix":null,"type":"fill_blank","instruction":"Complétez à l'aide d'adverbes de quantité.","context":null,"word_bank":null,"gradable":true,"section":"Caractéristiques","items":[{"id":"15-e01.1","context":null,"prompt":"– Voilà vos fruits.\n– J'en ai beaucoup ___. Enlevez-m'en ___\n– En avez-vous ___ comme ça ?\n– Oui, ça va. Par contre mettez-moi ___ haricots verts.","gradable":true,"blanks":[{"id":"b1","answers":["trop"],"choices":null},{"id":"b2","answers":["un peu"],"choices":null},{"id":"b3","answers":["assez"],"choices":null},{"id":"b4","answers":["beaucoup de","plus de"],"choices":null}],"verification":{"status":"verified","note":null},"match":null,"answers":{"confidence":"arbitrated","explanation":"« Beaucoup trop » exprime un excès (trop renforce beaucoup), « un peu » atténue la quantité à retirer, « assez » indique une quantité suffisante dans la question, et « beaucoup de » est suivi du nom pluriel « haricots verts » car les adverbes de quantité se construisent avec « de » devant un nom.","reference":null}}]},{"id":"15-e02","label":"2","suffix":null,"type":"fill_blank","instruction":"Complétez à l'aide d'adverbes d'intensité.","context":null,"word_bank":null,"gradable":true,"section":"Caractéristiques","items":[{"id":"15-e02.1","context":null,"prompt":"– Il faisait ___ froid et nous avions ___ marché dans la neige que nous étions morts de fatigue. Nous étions ___ fatigués, ___ fatigués que nous voulions nous arrêter, mais alors nous serions morts de froid.","gradable":true,"blanks":[{"id":"b1","answers":["tellement","si"],"choices":["tellement","tant","très","trop"]},{"id":"b2","answers":["tant","tellement"],"choices":["tant","si","très","trop"]},{"id":"b3","answers":["si","tellement"],"choices":["si","tant","trop"]},{"id":"b4","answers":["tellement","si"],"choices":["tellement","tant","très","trop"]}],"verification":{"status":"verified","note":null},"match":null,"answers":{"confidence":"arbitrated","explanation":"Devant un adjectif (« froid ») on emploie « tellement » pour exprimer l'intensité, et devant un verbe au participe passé (« marché ») on utilise « tant » ; les deux sont suivis de « que » pour introduire la conséquence. « Si » s'emploie devant un adjectif (« si fatigués ») et « tellement » peut aussi renforcer un adjectif (« tellement fatigués »), avec « que » marquant toujours la conséquence.","reference":null}}]},{"id":"15-e03","label":"3","suffix":null,"type":"transformation","instruction":"Dites le contraire.","context":null,"word_bank":null,"gradable":false,"section":"Caractéristiques","items":[{"id":"15-e03.1","context":null,"prompt":"Elle est plus grande que lui. ___","gradable":false,"blanks":[{"id":"b1","answers":[],"choices":null}],"verification":null,"match":null,"answers":{"confidence":"reference","explanation":null,"reference":"Elle est moins grande que lui."}},{"id":"15-e03.2","context":null,"prompt":"Elle est moins gentille que lui. ___","gradable":false,"blanks":[{"id":"b1","answers":[],"choices":null}],"verification":null,"match":null,"answers":{"confidence":"reference","explanation":null,"reference":"Elle est plus gentille que lui."}},{"id":"15-e03.3","context":null,"prompt":"Elle est aussi intelligente que lui. ___","gradable":false,"blanks":[{"id":"b1","answers":[],"choices":null}],"verification":null,"match":null,"answers":{"confidence":"reference","explanation":null,"reference":"Elle est moins intelligente que lui."}},{"id":"15-e03.4","context":null,"prompt":"Il y a plus d'hommes que de femmes à cette fête. ___","gradable":false,"blanks":[{"id":"b1","answers":[],"choices":null}],"verification":null,"match":null,"answers":{"confidence":"reference","explanation":null,"reference":"Il y a moins d’hommes que de femmes à cette fête."}},{"id":"15-e03.5","context":null,"prompt":"J'ai eu autant de chance que toi. ___","gradable":false,"blanks":[{"id":"b1","answers":[],"choices":null}],"verification":null,"match":null,"answers":{"confidence":"reference","explanation":null,"reference":"J’ai eu moins de chance que toi."}},{"id":"15-e03.6","context":null,"prompt":"Elle est de plus en plus jeune. ___","gradable":false,"blanks":[{"id":"b1","answers":[],"choices":null}],"verification":null,"match":null,"answers":{"confidence":"reference","explanation":null,"reference":"Elle est de moins en moins jeune."}}]},{"id":"15-e04","label":"4","suffix":null,"type":"open_question","instruction":"Écrivez un petit texte en utilisant quelques adverbes de temps choisis dans la liste suivante.","context":null,"word_bank":["hier","alors","depuis deux heures","aujourd'hui","avant","déjà","demain","après","autrefois","aussitôt après","aussitôt","maintenant","ensuite","bientôt","enfin"],"gradable":false,"section":"Caractéristiques","items":[{"id":"15-e04.1","context":null,"prompt":"Écrivez un petit texte en utilisant quelques adverbes de temps choisis dans la liste suivante.","gradable":false,"blanks":[],"verification":null,"match":null,"answers":{"confidence":"reference","explanation":null,"reference":"Autrefois, mes grands-parents habitaient à la campagne. Hier, je suis allé leur rendre visite. Depuis deux heures, nous parlions de leur jeunesse. Aujourd'hui, ils vivent toujours dans la même maison. Demain, je reviendrai avec mes enfants : ils seront contents de les revoir. Ensuite, nous irons tous ensemble nous promener, et bientôt, la famille sera de nouveau réunie. Enfin, mes grands-parents seront heureux de raconter leurs souvenirs."}}]},{"id":"15-e05","label":"5","suffix":null,"type":"fill_blank","instruction":"Complétez ce dialogue avec les adverbes de lieu qui conviennent.","context":null,"word_bank":null,"gradable":true,"section":"Caractéristiques","items":[{"id":"15-e05.1","context":null,"prompt":"– Il est d'ici ? – Non, il est ___.\n– Il habite loin d'ici ? – Non, son logement est ___ d'ici.\n– Il a travaillé quelque part ? – Non, ___.\n– Il a voyagé ? – Non, il est toujours resté ___.","gradable":true,"blanks":[{"id":"b1","answers":["d’ailleurs","ailleurs"],"choices":null},{"id":"b2","answers":["près","proche"],"choices":null},{"id":"b3","answers":["nulle part"],"choices":null},{"id":"b4","answers":["ici","là"],"choices":null}],"verification":{"status":"verified","note":"2 variante(s) ajoutée(s)"},"match":null,"answers":{"confidence":"arbitrated","explanation":"« D'ailleurs » est un adverbe de lieu qui marque l'origine : il s'oppose à « d'ici » et signifie « d'un autre endroit ». « Près » indique une proximité et s'oppose à « loin » ; « nulle part » est la forme négative de « quelque part ». Enfin, « ici » reprend le lieu déjà évoqué et s'oppose à l'idée de voyage.","reference":null}}]},{"id":"15-e06","label":"6","suffix":null,"type":"fill_blank","instruction":"Complétez avec des adverbes de manière.","context":null,"word_bank":null,"gradable":false,"section":"Caractéristiques","items":[{"id":"15-e06.1","context":null,"prompt":"– Comment vous êtes-vous rencontrés ? – ___\n– Comment va-t-elle ? – ___\n– Comment a-t-il cassé le vase ? – ___\n– Vous avez fait ça à deux ou trois ? – Non, on l'a fait tous ___\n– Est-ce qu'il a eu raison de partir ? – Oui, il a ___ fait de partir.\n– Tout va de plus en plus mal. – Oui, c'est ___ qu'avant.","gradable":false,"blanks":[{"id":"b1","answers":["par hasard"],"choices":null},{"id":"b2","answers":["bien"],"choices":null},{"id":"b3","answers":["accidentellement","maladroitement"],"choices":null},{"id":"b4","answers":["ensemble"],"choices":null},{"id":"b5","answers":["bien"],"choices":null},{"id":"b6","answers":["pire","pis"],"choices":null}],"verification":null,"match":null,"answers":{"confidence":"low","explanation":null,"reference":null}}]},{"id":"15-e07","label":"1","suffix":null,"type":"open_question","instruction":"Vous êtes l'ami(e) de Pierre. Portez votre propre jugement sur ces propos à l'aide des adverbes qui conviennent.","context":null,"word_bank":null,"gradable":false,"section":"Les adverbes de modalité","items":[{"id":"15-e07.1","context":null,"prompt":"– Tu as revu Pierre ?\n– Oui. Il voulait que nous sortions. On est allés au cinéma. Il a choisi un film policier. Le film était bon, les acteurs ne l'étaient pas trop.\n– Tu aurais préféré une comédie musicale ?","gradable":false,"blanks":[],"verification":null,"match":null,"answers":{"confidence":"reference","explanation":null,"reference":"Franchement, oui : personnellement, j'aurais vraiment préféré une comédie musicale. Malheureusement, Pierre n'aime que les films policiers ; heureusement, le film était bon, même si les acteurs n'étaient pas extraordinaires."}}]},{"id":"15-e08","label":"2","suffix":null,"type":"fill_blank","instruction":"Renforcez les affirmations et les négations à l'aide des adverbes qui conviennent.","context":null,"word_bank":null,"gradable":false,"section":"Les adverbes de modalité","items":[{"id":"15-e08.1","context":null,"prompt":"Un État, comme un ménage, ne peut dépenser plus d'argent qu'il n'en gagne.","gradable":false,"blanks":[],"verification":null,"match":null,"answers":{"confidence":null,"explanation":null,"reference":null}},{"id":"15-e08.2","context":null,"prompt":"On peut présenter les choses comme ça. Mais il ne faut pas oublier qu'à notre époque, c'est une règle difficil la seconde augmente aussi. C'est un proverbe figé où les deux « plus » se répondent.","reference":null}},{"id":"23-e04.2","context":null,"prompt":"___ on juge, ___ on aime.","gradable":true,"blanks":[{"id":"b1","answers":["Plus"],"choices":["Plus","Moins","Aussi","Tant"]},{"id":"b2","answers":["moins"],"choices":["moins","aussi","tant"]}],"verification":{"status":"verified","note":"l'arbitre juge les deux réponses acceptables ; 0 variante(s) ajoutée(s)"},"match":null,"answers":{"confidence":"unanimous","explanation":"On peut combiner « plus » et « moins » dans la corrélation : « plus… moins… » signifie que l'augmentation de la première idée entraîne la diminution de la seconde (plus on juge, et moins on aime).","reference":null}},{"id":"23-e04.3","context":null,"prompt":"___ tu travailles, ___ tu réussiras.","gradable":true,"blanks":[{"id":"b1","answers":["Plus"],"choices":["Plus","Moins","Aussi","Tant"]},{"id":"b2","answers":["plus"],"choices":["plus","moins","aussi","tant"]}],"verification":{"status":"verified","note":null},"match":null,"answers":{"confidence":"unanimous","explanation":"Ici les deux « plus » marquent une progression parallèle : l'effort (travailler) et le résultat (réussir) augmentent ensemble, d'où « Plus… plus… ».","reference":null}}]},{"id":"23-e06","label":"1","suffix":null,"type":"matching","instruction":"Reliez les éléments de la colonne de gauche à ceux de la colonne de droite avec « comme » et découvrez des expressions imagées.","context":null,"gradable":true,"section":"La comparaison exprimée par du lexique","items":[{"id":"23-e06.1","context":null,"prompt":"Mentir","gradable":true,"blanks":[],"verification":{"status":"verified","note":null},"match":{"options":["a. un paon","b. un âne","c. une pie","d. un arracheur de dents","e. un pinson"],"answer":"d. un arracheur de dents","variants":["d. un arracheur de dents","d"]},"answers":{"confidence":"unanimous","explanation":"L'expression figée « mentir comme un arracheur de dents » s'emploie pour quelqu'un qui ment effrontément, car autrefois les arracheurs de dents vantaient leurs talents sans douleur.","reference":null}},{"id":"23-e06.2","context":null,"prompt":"Bavard","gradable":true,"blanks":[],"verification":{"status":"verified","note":null},"match":{"options":["a. un paon","b. un âne","c. une pie","d. un arracheur de dents","e. un pinson"],"answer":"c. une pie","variants":["c. une pie","c"]},"answers":{"confidence":"unanimous","explanation":"On dit « bavard comme une pie » car la pie est un oiseau réputé pour son cri incessant, ce qui évoque une personne qui parle beaucoup.","reference":null}},{"id":"23-e06.3","context":null,"prompt":"Gai","gradable":true,"blanks":[],"verification":{"status":"verified","note":null},"match":{"options":["a. un paon","b. un âne","c. une pie","d. un arracheur de dents","e. un pinson"],"answer":"e. un pinson","variants":["e. un pinson","e"]},"answers":{"confidence":"unanimous","explanation":"La comparaison « gai comme un pinson » vient du chant joyeux de cet oiseau, associé à la bonne humeur.","reference":null}},{"id":"23-e06.4","context":null,"prompt":"Têtu","gradable":true,"blanks":[],"verification":{"status":"verified","note":null},"match":{"options":["a. un paon","b. un âne","c. une pie","d. un arracheur de dents","e. un pinson"],"answer":"b. un âne","variants":["b. un âne","b"]},"answers":{"confidence":"unanimous","explanation":"« Têtu comme un âne » est une expression figée : l'âne a la réputation de refuser d'avancer, d'où l'idée d'entêtement.","reference":null}},{"id":"23-e06.5","context":null,"prompt":"Fier","gradable":true,"blanks":[],"verification":{"status":"verified","note":null},"match":{"options":["a. un paon","b. un âne","c. une pie","d. un arracheur de dents","e. un pinson"],"answer":"a. un paon","variants":["a. un paon","a"]},"answers":{"confidence":"unanimous","explanation":"On dit « fier comme un paon » en référence au paon qui fait la roue pour montrer sa beauté, symbole d'orgueil.","reference":null}}]},{"id":"23-e07","label":"2","suffix":null,"type":"fill_blank","instruction":"Complétez par « de » ou « en » pour créer une comparaison et découvrez des expressions imagées.","context":null,"gradable":true,"section":"La comparaison exprimée par du lexique","items":[{"id":"23-e07.1","context":null,"prompt":"Une bouche ___ cœur    Elle a une jolie petite ___","gradable":true,"blanks":[{"id":"b1","answers":["en"],"choices":null},{"id":"b2","answers":["bouche en cœur"],"choices":null}],"verification":{"status":"verified","note":null},"match":null,"answers":{"confidence":"unanimous","explanation":"On emploie « en » devant un nom sans article pour décrire l'aspect ou la manière : « une bouche en cœur » signifie une bouche dessinée en forme de cœur.","reference":null}},{"id":"23-e07.2","context":null,"prompt":"Un appétit ___ ogre    Il mange beaucoup, il a ___","gradable":true,"blanks":[{"id":"b1","answers":["d'"],"choices":null},{"id":"b2","answers":["un appétit d'ogre"],"choices":null}],"verification":{"status":"verified","note":null},"match":null,"answers":{"confidence":"unanimous","explanation":"La préposition « de » (qui devient « d' » devant une voyelle) relie un nom à un autre nom pour indiquer une caractéristique : « un appétit d'ogre », c'est un appétit aussi grand que celui d'un ogre.","reference":null}},{"id":"23-e07.3","context":null,"prompt":"Un cœur ___ or    Il était très généreux, il avait ___","gradable":true,"blanks":[{"id":"b1","answers":["d'"],"choices":null},{"id":"b2","answers":["un cœur d'or"],"choices":null}],"verification":{"status":"verified","note":null},"match":null,"answers":{"confidence":"unanimous","explanation":"Comme pour « appétit d'ogre », « de » (élidé en « d' ») sert à comparer une personne à une image : « un cœur d'or » veut dire un cœur généreux comme l'or.","reference":null}},{"id":"23-e07.4","context":null,"prompt":"Une taille ___ guêpe    Elle est toute menue, elle a ___","gradable":true,"blanks":[{"id":"b1","answers":["de"],"choices":null},{"id":"b2","answers":["une taille de guêpe"],"choices":null}],"verification":{"status":"verified","note":null},"match":null,"answers":{"confidence":"unanimous","explanation":"Ici « de » n'est pas élidé car « guêpe » commence par une consonne : « une taille de guêpe » compare la finesse de la taille à celle d'une guêpe.","reference":null}},{"id":"23-e07.5","context":null,"prompt":"Agir ___ frère    Ils sont très amis. Luc ___ toujours ___ avec Marc.","gradable":true,"blanks":[{"id":"b1","answers":["en"],"choices":null},{"id":"b2","answers":["agit"],"choices":null},{"id":"b3","answers":["en frère"],"choices":null}],"verification":{"status":"verified","note":null},"match":null,"answers":{"confidence":"unanimous","explanation":"Devant un nom sans article qui exprime la manière d'agir, on utilise « en » : « agir en frère » signifie se comporter comme un frère.","reference":null}}]},{"id":"23-e08","label":"3","suffix":null,"type":"transformation","instruction":"Transformez les phrases proposées en remplaçant les mots soulignés par « en comparaison de » ou « par rapport à ».","context":null,"gradable":false,"section":"La comparaison exprimée par du lexique","items":[{"id":"23-e08.1","context":null,"prompt":"Si on compare Paris à d'autres mégalopoles, Paris a peu de gratte-ciel.","gradable":false,"blanks":[],"verification":null,"match":null,"answers":{"confidence":"reference","explanation":null,"reference":"En comparaison d'autres mégalopoles, Paris a peu de gratte-ciel. / Par rapport à d'autres mégalopoles, Paris a peu de gratte-ciel."}},{"id":"23-e08.2","context":null,"prompt":"Les Français comparativement à leurs voisins européens ont beaucoup de congés.","gradable":false,"blanks":[],"verification":null,"match":null,"answers":{"confidence":"reference","explanation":null,"reference":"Les Français, par rapport à leurs voisins européens, ont beaucoup de congés. / Les Français, en comparaison de leurs voisins européens, ont beaucoup de congés."}},{"id":"23-e08.3","context":null,"prompt":"La vie à la campagne comparée à la vie en ville est plus calme mais plus ennuyeuse.","gradable":false,"blanks":[],"verification":null,"match":null,"answers":{"confidence":"reference","explanation":null,"reference":"La vie à la campagne, par rapport à la vie en ville, est plus calme mais plus ennuyeuse. / La vie à la campagne, en comparaison de la vie en ville, est plus calme mais plus ennuyeuse."}},{"id":"23-e08.4","context":null,"prompt":"En comparant le taux de natalité en France à celui de certains autres pays européens, on constate que la France a un taux plus élevé.","gradable":false,"blanks":[],"verification":null,"match":null,"answers":{"confidence":"reference","explanation":null,"reference":"Par rapport au taux de natalité de certains autres pays européens, on constate que la France a un taux plus élevé. / En comparaison du taux de natalité de certains autres pays européens, on constate que la France a un taux plus élevé."}}]},{"id":"23-e09","label":"4","suffix":null,"type":"fill_blank","instruction":"Choisissez parmi les mots proposés pour découvrir ce dialogue entre deux amis : paraître – sembler – ressembler – avoir l'impression – avoir en commun – comparer à – être comparable","context":"Devant le musée après avoir vu une exposition d'un artiste contemporain","gradable":true,"section":"La comparaison exprimée par du lexique","items":[{"id":"23-e09.1","context":"Devant le musée après avoir vu une exposition d'un artiste contemporain","prompt":"– Non, mais ça ne ___ rien ! Tu peux m'expliquer ?","gradable":true,"blanks":[{"id":"b1","answers":["ressemble à"],"choices":["ressemble à","ressemble"]}],"verification":{"status":"verified","note":null},"match":null,"answers":{"confidence":"unanimous","explanation":"Le verbe « ressembler » se construit avec la préposition « à » : « ressembler à quelque chose ». Dans « ça ne ressemble à rien », on exprime que l'œuvre n'a aucun sens, aucune forme identifiable.","reference":null}},{"id":"23-e09.2","context":"Devant le musée après avoir vu une exposition d'un artiste contemporain","prompt":"– On ne te demande pas de ___ la réalité !","gradable":true,"blanks":[{"id":"b1","answers":["comparer à","ressembler à"],"choices":["comparer à","ressemble à"]}],"verification":{"status":"verified","note":"deux formes acceptables : « comparer à » conservé en tête, « ressembler à » ajouté (règle 3b : pas de correction sans faute établie) — Le verbe 'ressembler' se construit avec 'à' et ne nécessite pas de complément d'objet direct, tandis que 'comparer' requiert un objet direct avant 'à'."},"match":null,"answers":{"confidence":"unanimous","explanation":"« Comparer à » est la construction correcte du verbe comparer quand on met deux choses en relation : on compare une chose à une autre. Ici, « comparer à la réalité » signifie juger l'œuvre en la mettant en rapport avec la réalité.","reference":null}},{"id":"23-e09.3","context":"Devant le musée après avoir vu une exposition d'un artiste contemporain","prompt":"– Les tableaux de Picasso, ça ___ quelque chose ; je ___ de comprendre !","gradable":true,"blanks":[{"id":"b1","answers":["ressemble à","a en commun"],"choices":["ressemble à","ressemblent à","ressemble"]},{"id":"b2","answers":["ai l'impression"],"choices":["ai l'impression","ai impression","a l'impression","ai l'impressions"]}],"verification":{"status":"verified","note":null},"match":null,"answers":{"confidence":"arbitrated","explanation":"On retrouve « ressembler à » (construction avec « à ») pour dire que les tableaux de Picasso évoquent quelque chose de reconnaissable. Ensuite, « avoir l'impression de + infinitif » exprime une sensation, un sentiment personnel : « j'ai l'impression de comprendre ».","reference":null}},{"id":"23-e09.4","context":"Devant le musée après avoir vu une exposition d'un artiste contemporain","prompt":"– Ces deux artistes ne ___ pas ___ ; ils ne ___ rien ___.","gradable":true,"blanks":[{"id":"b1","answers":["sont"],"choices":["sont","est","soient"]},{"id":"b2","answers":["comparables"],"choices":["comparables","comparable","comparé"]},{"id":"b3","answers":["ont","se ressemblent"],"choices":["ont","a","aient"]},{"id":"b4","answers":["en commun","en"],"choices":["en commun","en commune","en communs"]}],"verification":{"status":"verified","note":null},"match":null,"answers":{"confidence":"arbitrated","explanation":"« Être comparable » (adjectif) s'emploie pour dire que deux choses peuvent être mises en parallèle ; à la forme négative : « ne sont pas comparables ». L'expression figée « avoir quelque chose en commun » signifie partager des points communs, ici niée : « ils n'ont rien en commun ».","reference":null}},{"id":"23-e09.5","context":"Devant le musée après avoir vu une exposition d'un artiste contemporain","prompt":"– Il me ___ qu'un artiste comme celui-là n'a rien à dire, il ___ vide !","gradable":true,"blanks":[{"id":"b1","answers":["semble"],"choices":["semble","semblent","sembler","paraît"]},{"id":"b2","answers":["paraît"],"choices":["paraît","paraissent","paraître","semble"]}],"verification":{"status":"verified","note":null},"match":null,"answers":{"confidence":"unanimous","explanation":"« Il me semble que » introduit une opinion personnelle (construction impersonnelle avec « me »). « Paraître » suivi d'un adjectif décrit l'apparence : « il paraît vide » veut dire qu'il donne l'impression d'être vide.","reference":null}}]}]}];
const KEY='gp-quiz-v1';
let S={res:{},flag:{},mode:'type'};
try{S=Object.assign(S,JSON.parse(localStorage.getItem(KEY))||{})}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const app=document.getElementById('app');
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>String(s).toLowerCase().replace(/[’‘`´]/g,"'").replace(/\s+/g,' ').trim().replace(/[.!?…]+$/,'').trim();
const plain=s=>norm(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/œ/g,'oe');
const letterOf=o=>{const m=String(o).match(/^\s*([a-z0-9]+)\s*[.)]/i);return m?m[1].toLowerCase():String(o).toLowerCase()};
const answered=b=>(b.answers||[]).length>0;
const blanksOf=it=>(it.blanks||[]).filter(answered);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const vstat=it=>(it.verification||{}).status;

/* ---- classify each item: fill (auto-graded) / match / open (self-assessed) / null (skip) ---- */
function modeOf(ex,it){
  const a=it.answers||{};
  const ok=ex.gradable!==false&&it.gradable!==false&&a.confidence!=='low'&&vstat(it)!=='suspect';
  if(it.match&&(it.match.options||[]).length&&it.match.answer)return ok?'match':'open';
  const bl=blanksOf(it);
  if(bl.length&&ok&&a.confidence!=='reference')return 'fill';
  if(a.reference||bl.length)return 'open';
  return null;
}
function choicesOf(b){
  const c=[...new Set((b.choices||[]).map(String))];
  if(c.length<2)return null;
  if(!c.some(x=>b.answers.some(a=>norm(a)===norm(x))))c.push(b.answers[0]);
  return c;
}
const hasChoices=q=>q.m==='fill'&&blanksOf(q.it).every(b=>choicesOf(b));
function refList(it){
  const a=it.answers||{};
  if(it.match&&it.match.options){const o=it.match.options.find(o=>letterOf(o)===String(it.match.answer).toLowerCase());return [o||it.match.answer]}
  const bl=blanksOf(it);
  if(bl.length===1)return [...new Set([a.reference,...bl[0].answers].filter(Boolean))].slice(0,3);
  return [a.reference||bl.map(b=>b.answers[0]).join(' / ')].filter(Boolean);
}
const IDX={};
const CH=DATA.map(ch=>{
  const exs=[],qs=[];
  for(const ex of ch.exercises||[]){
    const eq=[];
    for(const it of ex.items||[]){const m=modeOf(ex,it);if(m){const q={ch,ex,it,m};eq.push(q);qs.push(q);IDX[it.id]=q}}
    if(eq.length)exs.push({ex,qs:eq});
  }
  return {ch,exs,qs,label:ch.number!=null?ch.number:String(ch.id||'').toUpperCase()};
}).filter(c=>c.qs.length);
const prog=qs=>({done:qs.filter(q=>S.res[q.it.id]!=null).length,good:qs.filter(q=>S.res[q.it.id]===1).length});
const firstTodo=qs=>{const i=qs.findIndex(q=>S.res[q.it.id]==null);return i<0?0:i};
const trunc=(s,n)=>{s=String(s||'');return s.length>n?s.slice(0,n-1)+'…':s};

/* ---- screens ---- */
let sess=null,pick=null,picks=[],view='home',curK=0;
const seg=nq=>`<div class="seg"><span>Réponses</span><button class="${S.mode!=='qcm'?'on':''}" data-act="mode" data-v="type">Saisie</button><button class="${S.mode==='qcm'?'on':''}" data-act="mode" data-v="qcm" ${nq===0?'disabled':''}>QCM${nq!=null?` (${nq})`:''}</button></div>`;
function rerender(){view==='chapter'?chapter(curK):home()}

function home(){
  sess=null;view='home';
  const wrongQ=CH.flatMap(c=>c.qs).filter(q=>S.res[q.it.id]===0);
  const nq=CH.flatMap(c=>c.qs).filter(hasChoices).length;
  let h=`<h1>Grammaire avancée</h1><p class="sub">${CH.reduce((n,c)=>n+c.qs.length,0)} questions · ${CH.length} chapitres</p><main>`;
  if(!CH.length)h+='<p>Aucune donnée : lancez make_app.py.</p>';
  h+=seg(nq);
  CH.forEach((c,k)=>{
    const p=prog(c.qs);
    h+=`<button class="card" data-act="chap" data-k="${k}"><b>${esc(c.label)} · ${esc(c.ch.title)}</b><span>${c.exs.length} exercices · ${p.done}/${c.qs.length} faites${p.done?` · ${p.good} justes`:''}</span><div class="pb"><i style="width:${p.done/c.qs.length*100}%"></i></div></button>`;
  });
  h+=`<div class="row"><button class="btn" data-act="rev" ${wrongQ.length?'':'disabled style="opacity:.4"'}>Réviser mes erreurs (${wrongQ.length})</button></div>
  <div class="foot"><button class="link" data-act="exp">Exporter / signalements (${Object.keys(S.flag).length})</button><button class="link" data-act="reset">Réinitialiser</button></div></main>`;
  app.innerHTML=h;window.scrollTo(0,0);
}

function chapter(k){
  const c=CH[k];sess=null;view='chapter';curK=k;
  const p=prog(c.qs),nq=c.qs.filter(hasChoices).length;
  let h=`<header><button class="back" data-act="home" aria-label="Retour">‹</button><div class="t">${esc(c.label)} · ${esc(c.ch.title)}</div></header><main>`;
  h+=seg(nq);
  h+=`<div class="row" style="margin:0 0 6px"><button class="btn" data-act="all">${p.done&&p.done<c.qs.length?'Reprendre le chapitre':'Tout le chapitre'} (${c.qs.length})</button></div>`;
  let sec=null;
  c.exs.forEach((e,j)=>{
    const ex=e.ex;
    if(ex.section&&ex.section!==sec){sec=ex.section;h+=`<h2 class="sec">${esc(sec)}</h2>`}
    const q=prog(e.qs);
    h+=`<button class="card" data-act="exo" data-j="${j}"><b>Exercice ${esc(ex.label||'')}${esc(ex.suffix||'')}</b><span>${esc(trunc(ex.instruction,110))}</span><br><span>${q.done}/${e.qs.length} faites${q.done?` · ${q.good} justes`:''}</span><div class="pb"><i style="width:${q.done/e.qs.length*100}%"></i></div></button>`;
  });
  h+='</main>';app.innerHTML=h;window.scrollTo(0,0);
}

function start(title,qs,i,k,j){sess={title,qs,i:i||0,done:false,right:0,wrong:0,k,j};ask()}

function ask(){
  const q=sess.qs[sess.i];if(!q)return end();
  const {ch,ex,it,m}=q,n=sess.qs.length;sess.done=false;pick=null;
  const qcm=S.mode==='qcm'&&hasChoices(q);sess.qcm=qcm;
  let h=`<header><button class="back" data-act="back" aria-label="Retour">‹</button><div class="t">${esc(sess.title)}</div><div class="c">${sess.i+1}/${n}</div></header><div class="bar"><i style="width:${sess.i/n*100}%"></i></div><main>`;
  h+=`<div class="ex"><b>Exercice ${esc(ex.label||'')}${esc(ex.suffix||'')}.</b> ${esc(ex.instruction)}</div>`;
  [ex.context,it.context&&it.context!==ex.context?it.context:null].filter(Boolean).forEach(c=>h+=`<p class="ctx">${esc(c)}</p>`);
  if((ex.word_bank||[]).length)h+=`<div class="bank">${ex.word_bank.map(w=>`<span>${esc(w)}</span>`).join('')}</div>`;
  h+=`<div class="q" id="q">`;
  if(m==='fill'&&qcm){
    const bl=blanksOf(it),parts=String(it.prompt).split(/_{3,}/);picks=bl.map(()=>null);
    const slot=i=>`<span class="slot" id="s${i}">……</span>`;
    h+=parts.length-1===bl.length?parts.map((p,i)=>esc(p)+(i<bl.length?slot(i):'')).join(''):esc(it.prompt);
    bl.forEach((b,i)=>{h+=`<div class="opts wrap" data-b="${i}">${bl.length>1?`<div class="lbl">Trou ${i+1}</div>`:''}${shuffle(choicesOf(b)).map(c=>`<button data-act="cpick" data-b="${i}" data-v="${esc(c)}">${esc(c)}</button>`).join('')}</div>`});
  }else if(m==='fill'){
    const bl=blanksOf(it),parts=String(it.prompt).split(/_{3,}/);
    const inp=i=>{const L=Math.max(...bl[i].answers.map(a=>a.length));return `<input class="blank" data-i="${i}" style="width:${Math.min(Math.max(L+2,6),26)}ch" autocapitalize="off" autocorrect="off" autocomplete="off" spellcheck="false" lang="fr" enterkeyhint="next" aria-label="Trou ${i+1}">`};
    if(parts.length-1===bl.length)h+=parts.map((p,i)=>esc(p)+(i<bl.length?inp(i):'')).join('');
    else h+=esc(it.prompt)+'<div class="stack">'+bl.map((b,i)=>inp(i)).join('')+'</div>';
  }else if(m==='match'){
    h+=esc(it.prompt)+'<div class="opts">'+it.match.options.map((o,i)=>`<button data-act="pick" data-i="${i}">${esc(o)}</button>`).join('')+'</div>';
  }else{
    h+=esc(it.prompt).replace(/_{3,}/g,'……')+'<textarea id="ta" rows="3" placeholder="Votre réponse (facultatif)" autocapitalize="off" spellcheck="false" lang="fr"></textarea>';
  }
  h+=`</div><div id="fb"></div><div class="row" id="rw"><button class="btn" id="go" data-act="go">${m==='open'?'Voir la réponse':'Vérifier'}</button></div>
  <div class="foot"><button class="link" data-act="skip">Passer</button>${m==='fill'&&hasChoices(q)?`<button class="link" data-act="qm">${qcm?'Saisir la réponse':'Voir les choix (QCM)'}</button>`:''}<button class="link" data-act="flag">${S.flag[it.id]?'⚑ Signalée':'⚑ Signaler cette réponse'}</button></div></main>`;
  app.innerHTML=h;window.scrollTo(0,0);
  const f=app.querySelector('input.blank');if(f)f.focus();
}

const nextBtn='<button class="btn" data-act="next">Suivant</button>';
function record(ok){const q=sess.qs[sess.i];S.res[q.it.id]=ok?1:0;ok?sess.right++:sess.wrong++;save()}
function foot(it){return vstat(it)==='verified'?'Réponse confirmée par une seconde vérification IA (⚑ pour signaler).':'Réponse générée par IA, à vérifier en cas de doute (⚑ pour signaler).'}
function feedback(ok,body,q){
  const a=q.it.answers||{};
  document.getElementById('fb').innerHTML=`<div class="fb ${ok?'ok':'ko'}"><b>${ok?'✓ Correct':'✗ Pas tout à fait'}</b>${body||''}${a.explanation?`<p>${esc(a.explanation)}</p>`:''}<small>${foot(q.it)}</small></div>`;
}
function go(){
  if(sess.done)return;const q=sess.qs[sess.i],{it,m}=q;
  if(m==='fill'&&sess.qcm){
    const bl=blanksOf(it);if(picks.some(p=>p==null))return;
    const oks=bl.map((b,i)=>b.answers.some(a=>norm(a)===norm(picks[i])));
    app.querySelectorAll('.opts[data-b]').forEach(g=>{const i=+g.dataset.b;g.querySelectorAll('button').forEach(b=>{b.disabled=true;const good=bl[i].answers.some(a=>norm(a)===norm(b.dataset.v));if(good)b.classList.add('good');else if(b.dataset.v===picks[i])b.classList.add('bad')})});
    oks.forEach((o,i)=>{const s=document.getElementById('s'+i);if(s)s.className='slot '+(o?'ok':'ko')});
    const ok=oks.every(Boolean);sess.done=true;record(ok);
    feedback(ok,ok?'':`<div class="ref">${esc(bl.map(b=>b.answers[0]).join(' · '))}</div>`,q);document.getElementById('rw').innerHTML=nextBtn;
  }else if(m==='fill'){
    const bl=blanksOf(it),ins=[...app.querySelectorAll('input.blank')];
    let ok=true;const acc=[];
    ins.forEach((el,i)=>{const v=norm(el.value),A=bl[i].answers;el.disabled=true;
      if(v&&A.some(a=>norm(a)===v))el.classList.add('ok');
      else if(v&&A.some(a=>plain(a)===plain(v))){el.classList.add('ok');acc.push(A[0])}
      else{el.classList.add('ko');ok=false}});
    sess.done=true;record(ok);
    let body='';
    if(!ok)body=`<div class="ref">${esc(bl.map(b=>b.answers[0]).join(' · '))}</div>`;
    else if(acc.length)body=`<div>Attention aux accents : <span class="ref">${esc(acc.join(' · '))}</span></div>`;
    feedback(ok,body,q);document.getElementById('rw').innerHTML=nextBtn;
  }else if(m==='match'){
    if(pick==null)return;
    const opts=it.match.options,right=String(it.match.answer).toLowerCase();
    const ok=letterOf(opts[pick])===right||(it.match.variants||[]).includes(opts[pick]);
    app.querySelectorAll('.opts button').forEach((b,i)=>{b.disabled=true;if(letterOf(opts[i])===right)b.classList.add('good');else if(i===pick)b.classList.add('bad')});
    sess.done=true;record(ok);feedback(ok,'',q);document.getElementById('rw').innerHTML=nextBtn;
  }else{
    document.getElementById('ta').disabled=true;
    const refs=refList(it),v=it.verification||{};
    document.getElementById('fb').innerHTML=`<div class="fb ok" style="border-left-color:var(--acc);background:var(--card)"><b>Réponse modèle</b>${refs.map(r=>`<div class="ref">${esc(r)}</div>`).join('')}${(it.answers||{}).explanation?`<p>${esc(it.answers.explanation)}</p>`:''}${v.status==='suspect'?`<p class="warn">Réponse contestée lors de la vérification${v.note?' : '+esc(v.note):''}. À prendre avec prudence.</p>`:''}<small>Réponse générée par IA : d’autres formulations peuvent être correctes.</small></div>`;
    document.getElementById('rw').innerHTML='<button class="btn alt" data-act="self0">Pas tout à fait</button><button class="btn" data-act="self1">J’avais juste</button>';
    sess.done=true;
  }
}
function end(){
  const tot=sess.right+sess.wrong,pct=Math.round(sess.right/Math.max(1,tot)*100);
  const nx=sess.k!=null&&sess.j!=null?CH[sess.k].exs[sess.j+1]:null;
  app.innerHTML=`<header><button class="back" data-act="back">‹</button><div class="t">${esc(sess.title)}</div></header><main><div class="big">${sess.right}/${tot}</div><p class="sub" style="text-align:center">${pct} % de réussite sur cette série</p><div class="row">${nx?'<button class="btn" data-act="nextex">Exercice suivant</button>':''}<button class="btn ${nx?'alt':''}" data-act="back">${sess.k!=null?'Retour au chapitre':'Retour'}</button></div></main>`;
}
function exportData(){
  const flagged=Object.keys(S.flag).map(id=>{const q=IDX[id];return q?{id,prompt:q.it.prompt,reponse:refList(q.it)}:{id}});
  const blob=new Blob([JSON.stringify({flagged,res:S.res},null,1)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='progression-quiz.json';document.body.appendChild(a);a.click();a.remove();
}
function startEx(k,j){const c=CH[k],e=c.exs[j];start(`${c.label} · Ex. ${e.ex.label||''}${e.ex.suffix||''}`,e.qs,firstTodo(e.qs),k,j)}

app.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const act=b.dataset.act;
  if(act==='chap')chapter(+b.dataset.k);
  else if(act==='all'){const c=CH[curK];start(c.label+' · '+c.ch.title,c.qs,firstTodo(c.qs),curK,null)}
  else if(act==='exo')startEx(curK,+b.dataset.j);
  else if(act==='nextex')startEx(sess.k,sess.j+1);
  else if(act==='rev'){start('Révision',CH.flatMap(c=>c.qs).filter(q=>S.res[q.it.id]===0),0,null,null)}
  else if(act==='home')home();
  else if(act==='back'){sess&&sess.k!=null?chapter(sess.k):home()}
  else if(act==='mode'){S.mode=b.dataset.v;save();rerender()}
  else if(act==='qm'){if(!sess.done){S.mode=sess.qcm?'type':'qcm';save();ask()}}
  else if(act==='go')go();
  else if(act==='next'||act==='skip'){sess.i++;ask()}
  else if(act==='self1'||act==='self0'){record(act==='self1');sess.i++;ask()}
  else if(act==='pick'&&!sess.done){pick=+b.dataset.i;app.querySelectorAll('.opts button').forEach(x=>x.classList.toggle('sel',x===b))}
  else if(act==='cpick'&&!sess.done){const i=+b.dataset.b;picks[i]=b.dataset.v;b.parentNode.querySelectorAll('button').forEach(x=>x.classList.toggle('sel',x===b));const s=document.getElementById('s'+i);if(s){s.textContent=b.dataset.v;s.className='slot set'}}
  else if(act==='flag'){const id=sess.qs[sess.i].it.id;S.flag[id]?delete S.flag[id]:S.flag[id]=1;save();b.textContent=S.flag[id]?'⚑ Signalée':'⚑ Signaler cette réponse'}
  else if(act==='exp')exportData();
  else if(act==='reset'){if(confirm('Effacer toute la progression ?')){S={res:{},flag:{},mode:S.mode};save();home()}}
});
app.addEventListener('keydown',e=>{
  if(e.key!=='Enter'||!e.target.classList.contains('blank'))return;e.preventDefault();
  const ins=[...app.querySelectorAll('input.blank')],i=ins.indexOf(e.target);
  if(sess&&sess.done){sess.i++;ask()}else if(i<ins.length-1)ins[i+1].focus();else go();
});

/* ---- French accent bar above the keyboard ---- */
const acc=document.getElementById('acc');
'é è ê ë à â ù û î ï ô œ ç É ’ « »'.split(' ').forEach(c=>{const b=document.createElement('button');b.textContent=c;acc.appendChild(b)});
acc.addEventListener('pointerdown',e=>{
  e.preventDefault();const b=e.target.closest('button'),el=document.activeElement;
  if(!b||!el||!el.matches('input,textarea'))return;
  el.setRangeText(b.textContent,el.selectionStart,el.selectionEnd,'end');
});
const place=()=>{const v=window.visualViewport;if(v)acc.style.bottom=Math.max(0,window.innerHeight-v.height-v.offsetTop)+'px'};
if(window.visualViewport){visualViewport.addEventListener('resize',place);visualViewport.addEventListener('scroll',place)}
document.addEventListener('focusin',e=>{if(e.target.matches('input,textarea')){acc.hidden=false;place()}});
document.addEventListener('focusout',()=>setTimeout(()=>{if(!document.activeElement||!document.activeElement.matches('input,textarea'))acc.hidden=true},150));

home();
</script>
</body>
