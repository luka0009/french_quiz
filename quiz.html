<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#3b4cca">
<title>Grammaire – Quiz</title>
<style>
:root{--bg:#eef1f5;--card:#fff;--ink:#14213d;--mute:#5d6678;--acc:#3b4cca;--onacc:#fff;--ok:#17703a;--okbg:#e2f3e8;--ko:#a8261f;--kobg:#fae3e1;--line:#cfd5e0;--serif:"Iowan Old Style",Charter,"Palatino Linotype",Georgia,serif;--sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
@media(prefers-color-scheme:dark){:root{--bg:#10141f;--card:#1a2030;--ink:#eaeefb;--mute:#97a0b8;--acc:#8c9bff;--onacc:#0e1226;--ok:#74d89a;--okbg:#14301f;--ko:#ff938b;--kobg:#3a1d1b;--line:#323a52}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 var(--sans);-webkit-text-size-adjust:100%}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
#app{max-width:640px;margin:0 auto;padding-bottom:90px}
header{display:flex;align-items:center;gap:10px;padding:12px 14px}
header .t{flex:1;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .c{color:var(--mute);font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.back{font-size:26px;line-height:1;padding:2px 10px 6px 0}
.bar{height:4px;background:var(--line);margin:0 14px;border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc)}
main{padding:14px}
.ex{color:var(--mute);font-size:15px;margin-bottom:10px}
.ex b{color:var(--ink)}
.ctx{font-style:italic;color:var(--mute);font-size:15px;margin:0 0 8px}
.bank{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.bank span{border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:15px;background:var(--card)}
.q{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px 16px;font:21px/2.1 var(--serif);white-space:pre-line}
.q .stack{display:flex;flex-direction:column;gap:10px;margin-top:8px}
input.blank,textarea{font:inherit;font-size:19px;color:var(--ink);background:transparent;border:0;border-bottom:2px solid var(--mute);border-radius:0;padding:0 4px;text-align:center;max-width:100%;outline:none;font-family:var(--serif)}
input.blank:focus{border-color:var(--acc)}
input.blank.ok{border-color:var(--ok);color:var(--ok)}
input.blank.ko{border-color:var(--ko);color:var(--ko);text-decoration:line-through}
textarea{display:block;width:100%;margin-top:10px;border:1px solid var(--line);border-radius:8px;padding:10px;text-align:left;line-height:1.4;white-space:normal}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:10px;font:17px var(--sans)}
.opts button{text-align:left;border:1.5px solid var(--line);border-radius:8px;padding:12px 14px;background:var(--bg)}
.opts button.sel{border-color:var(--acc);background:var(--card);box-shadow:inset 0 0 0 1px var(--acc)}
.opts button.good{border-color:var(--ok);background:var(--okbg)}
.opts button.bad{border-color:var(--ko);background:var(--kobg)}
.fb{margin-top:14px;border-radius:10px;padding:12px 14px;font-size:16px}
.fb.ok{background:var(--okbg);color:var(--ink);border-left:5px solid var(--ok)}
.fb.ko{background:var(--kobg);color:var(--ink);border-left:5px solid var(--ko)}
.fb p{margin:6px 0 0}.fb small{display:block;color:var(--mute);margin-top:8px}
.fb .ref{font:19px/1.5 var(--serif);margin-top:4px}
.row{display:flex;gap:10px;margin-top:16px}
.btn{flex:1;min-height:50px;border-radius:10px;background:var(--acc);color:var(--onacc);font-weight:600}
.btn.alt{background:var(--card);color:var(--ink);border:1.5px solid var(--line)}
.link{color:var(--mute);font-size:14px;padding:12px 4px}
.card{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:10px}
.card b{display:block}.card span{color:var(--mute);font-size:15px}
.card .pb{height:4px;background:var(--line);border-radius:2px;margin-top:8px;overflow:hidden}.card .pb i{display:block;height:100%;background:var(--acc)}
h1{font:600 26px/1.2 var(--serif);margin:6px 14px 4px}
.sub{margin:0 14px 12px;color:var(--mute);font-size:15px}
.foot{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:10px}
.big{font:600 44px/1.1 var(--serif);text-align:center;margin:30px 0 6px}
#acc{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;gap:4px;justify-content:center;flex-wrap:wrap;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:9}
#acc[hidden]{display:none}
#acc button{min-width:34px;height:40px;border-radius:7px;background:var(--bg);font:20px var(--serif)}

h2.sec{font:600 15px/1.3 var(--sans);color:var(--mute);margin:20px 2px 8px}
.seg{display:flex;align-items:center;gap:8px;margin:0 0 14px;color:var(--mute);font-size:15px}
.seg button{border:1.5px solid var(--line);border-radius:999px;padding:6px 14px;background:var(--card)}
.seg button.on{background:var(--acc);color:var(--onacc);border-color:var(--acc)}
.seg button[disabled]{opacity:.4}
.slot{display:inline-block;min-width:3.5ch;border-bottom:2px solid var(--mute);text-align:center;padding:0 6px;color:var(--mute)}
.slot.set{color:var(--ink);border-color:var(--acc)}.slot.ok{color:var(--ok);border-color:var(--ok)}.slot.ko{color:var(--ko);border-color:var(--ko);text-decoration:line-through}
.opts.wrap{flex-direction:row;flex-wrap:wrap}.opts.wrap button{flex:1 1 auto;text-align:center}
.lbl{width:100%;color:var(--mute);font-size:14px}
.warn{color:var(--ko);font-size:14px;margin:8px 0 0}
</style>
</head>
<body>
<div id="app"></div>
<div id="acc" hidden></div>
<script>
const DATA=[{"id":"ch01","number":1,"title":"L'ARTICLE","exercises":[{"id":"01-e01","label":"1","suffix":null,"type":"fill_blank","instruction":"Complétez ces mini-dialogues avec : un, une, des ou le, la, les.","context":"Devant le lycée","gradable":true,"section":"L'article indéfini/défini","items":[{"id":"01-e01.1","context":"Devant le lycée","prompt":"– J'ai ___ bonne nouvelle à vous annoncer : ___ examen de maths est reporté à ___ semaine prochaine.","gradable":true,"blanks":[{"id":"b1","answers":["une"],"choices":["une","un","des","la"]},{"id":"b2","answers":["l'"],"choices":["l'","un","les"]},{"id":"b3","answers":["la"],"choices":["la","le","une","les"]}],"verification":{"status":"verified","note":null},"match":null,"answers":{"confidence":"unanimous","explanation":"« Une » introduit un élément nouveau (bonne nouvelle) ; « l' » devant examen est le défini car il s'agit d'un examen précis, déjà connu ; « la » devant semaine prochaine est aussi un défini, car la semaine est déterminée par « prochaine ».","reference":null}},{"id":"01-e01.2","context":"Devant le lycée","prompt":"– Ah, ça, c'est ___ bonne nouvelle. Je vais l'annoncer à ___ bande de copains à ___ sortie ___ cours.","gradable":true,"blanks":[{"id":"b1","answers":["une"],"choices":["une","un","la","des"]},{"id":"b2","answers":["la"],"choices":["la","le","une","les"]},{"id":"b3","answers":["la"],"choices":["la","le","une","les"]},{"id":"b4","answers":["des"],"choices":["des","les","de"]}],"verification":{"status":"verified","note":null},"match":null,"answers":{"confidence":"unanimous","explanation":"« Une » présente une nouvelle information (bonne nouvelle) ; « la » devant bande de copains est défini car il s'agit d'un groupe connu ; « la » devant sortie est défini car il s'agit de la sortie habituelle des cours ; « des » est l'indéfini pluriel devant cours, car on ne précise pas lesquels.","reference":null}},{"id":"01-e01.3","context":"Anniversaire","prompt":"– Pour ___ anniversaire de Lise, tu as ___ idée de cadeau ?","gradable":true,"blanks":[{"id":"b1","answers":["l'"],"choices":["l'","le","un","la"]},{"id":"b2","answers":["une"],"choices":["une","un","la","des"]}],"verification":{"status":"verified","note":null},"match":null,"answers":{"confidence":"unanimous","explanation":"« L' » devant anniversaire est défini car il s'agit de l'anniversaire précis de Lise ; « une » devant idée est indéfini car on ne sait pas encore quelle idée.","reference":null}},{"id":"01-e01.4","context":"Anniversaire","prompt":"– J'ai pensé lui offrir ___ roses rouges.","gradable":true,"blanks":[{"id":"b1","answers":["des"],"choices":["des","les","de","une"]}],"verification":{"status":"verified","note":null},"match":null,"answers":{"confidence":"unanimous","explanation":"« Des » est l'article indéfini pluriel : on parle de roses en général, sans les identifier précisément.","reference":null}},{"id":"01-e01.5","context":"Anniversaire","prompt":"– C'est ___ bonne idée ! Il y a ___ fleuriste à côté de ___ maison qui vend ___ roses magnifiques et pas très chères.","gradable":true,"blanks":[{"id":"b1","answers":["une"],"choices":["une","un","la","des"]},{"id":"b2","answers":["un"],"choices":["un","une","le","des"]},{"id":"b3","answers":["la"],"choices":["la","le","une","les"]},{"id":"b4","answers":["des"],"choices":["des","les","de"]}],"verification":{"status":"verified","note":null},"match":null,"answers":{"confidence":"unanimous","explanation":"« Une » devant bonne idée est indéfini (on la présente) ; « un » devant fleuriste est indéfini (il y en a un, non précisé) ; « la » devant maison est défini (la maison dont on parle) ; « des » devant roses est indéfini pluriel (des roses en général).","reference":null}},{"id":"01-e01.6","context":"Mail de Romain à son amie","prompt":"Ici tout va bien. J'habite dans ___ immeuble près de ___ université. J'ai ___ petit studio sous ___ toits. C'est petit, mais c'est confortable. Il y a ___ douche et ___ kitchenette. Dans ___ pièce principale, il y a ___ fenêtre avec ___ vue superbe sur ___ ville. ___ voisins sont gentils, ce sont ___ étudiants, comme moi. Vincent a sa famille qui habite ___ Provence et Amandine vient de ___ région de Bordeaux. Malheureusement pour moi, ___ propriétaire ne veut plus louer ___ studio à ___ rentrée prochaine et il faut que je cherche ___ nouveau logement.","gradable":true,"blanks":[{"id":"b1","answers":["un"],"choices":["un","une","le","des"]},{"id":"b2","answers":["l'"],"choices":["l'","le","la","une"]},{"id":"b3","answers":["un"],"choices":["un","une","le","des"]},{"id":"b4","answers":["les"],"choices":["les","des","le"]},{"id":"b5","answers":["une"],"choices":["une","un","la","des"]},{"id":"b6","answers":["une"],"choices":["une","un","la","des"]},{"id":"b7","answers":["la"],"choices":["la","le","une","les"]},{"id":"b8","answers":["une"],"choices":["une","un","la","des"]},{"id":"b9","answers":["une"],"choices":["une","un","la","des"]},{"id":"b10","answers":["la"],"choices":["la","le","une","les"]},{"id":"b11","answers":["Les"],"choices":["Les","Des","Le"]},{"id":"b12","answers":["des"],"choices":["des","les","de"]},{"id":"b13","answers":["la"],"choices":["la","le","une","les"]},{"id":"b14","answers":["la"],"choices":["la","le","une","les"]},{"id":"b15","answers":["le"],"choices":["le","la","un","les"]},{"id":"b16","answers":["le"],"choices":["le","la","un","les"]},{"id":"b17","answers":["la"],"choices":["la","le","une","les"]},{"id":"b18","answers":["un"],"choices":["un","une","le","des"]}],"verification":{"status":"verified","note":null},"match":null,"answers":{"confidence":"unanimous","explanation":"« les toits » (b4) : article défini pluriel car on parle des toits de l'immeuble, déjà identifiés. « une vue » (b9) et « une douche », « une kitchenette », « une fenêtre » : article indéfini féminin singulier pour un élément non précisé. « la ville » (b10), « la Provence » (b13), « la région » (b14), « la rentrée » (b17) : article défini féminin, car il s'agit d'un lieu ou d'un moment connu ou unique. « le propriétaire » (b15) et « le studio » (b16) : article défini masculin, car ces éléments sont déjà mentionnés ou identifiables. « un logement » (b18) : article indéfini masculin, car il s'agit d'un nouveau logement non encore déterminé.","reference":null}},{"id":"01-e01.7","context":"Mail de Romain à son amie","prompt":"Et toi, comment vas-tu ? Donne-moi ___ nouvelles. Bises.","gradable":true,"blanks":[{"id":"b1","answers":["des"],"choices":["des","les","de"]}],"verification":{"status":"verified","note":null},"match":null,"answers":{"confidence":"unanimous","explanation":"« Des » est l'article indéfini pluriel : « donner des nouvelles » est une expression figée où l'on ne précise pas lesquelles.","reference":null}},{"id":"01-e01.8","context":"À la brocante","prompt":"___ week-end dernier, on est allés dans ___ Périgord dans ___ brocante. Julien adore ___ meubles ___ années cinquante. On a acheté ___ table et ___ chaises pour ___ prix raisonnable. Ils nous ont vendu ___ chaises cent cinquante euros ___ six. J'ai acheté ___ assiettes anciennes à dix euros ___ douzaine.","gradable":true,"blanks":[{"id":"b1","answers":["Le"],"choices":["Le","Un","La","Les"]},{"id":"b2","answers":["le"],"choices":["le","la","les","un"]},{"id":"b3","answers":["une"],"choices":["une","un","des","la"]},{"id":"b4","answers":["les"],"choices":["les","des","le","la"]},{"id":"b5","answers":["des","les"],"choices":["des","le","une","la"]},{"id":"b6","answers":["une"],"choices":["une","un","des","la"]},{"id":"b7","answers":["des"],"choices":["des","le","une","la"]},{"id":"b8","answers":["un"],"choices":["un","une","des","le"]},{"id":"b9","answers":["les","des"],"choices":["les","le","une","la"]},{"id":"b10","answers":["les"],"choices":["les","des","le","la"]},{"id":"b11","answers":["des"],"choices":["des","le","une","la"]},{"id":"b12","answers":["la"],"choices":["la","le","une","des"]}],"verification":{"status":"verified","note":null},"match":null,"answers":{"confidence":"arbitrated","explanation":null,"reference":null}}]},{"id":"01-e02a","label":"2","suffix":"a","type":"fill_blank","instruction":"Complétez avec le, la, les pour découvrir une expression idiomatique","context":null,"gradable":true,"section":"L'article indéfini/défini","items":[{"id":"01-e02a.1","context":null,"prompt":"___ nuit porte conseil.","gradable":true,"blanks":[{"id":"b1","answers":["La"],"choices":["La","Le","Les"]}],"verification":{"status":"verified","note":null},"match":null,"answers":{"confidence":"unanimous","explanation":"Dans l'expression figée « la nuit porte conseil », on emploie l'article défini « la » devant un nom féminin singulier, car il s'agit d'une généralité (la nuit en général).","reference":null}},{"id":"01-e02a.2","context":null,"prompt":"C'est clair comme ___ jour.","gradable":true,"blanks":[{"id":"b1","answers":["le"],"choices":["le","la","les"]}],"verification":{"status":"verified","note":null},"match":null,"answers":{"confidence":"unanimous","explanation":"L'expression « clair comme le jour » utilise l'article défini « le » devant « jour », nom masculin singulier, pour désigner une réalité unique et connue de tous.","reference":null}},{"id":"01-e02a.3","context":null,"prompt":"Rester ___ bec dans ___ eau.","gradable":true,"blanks":[{"id":"b1","answers":["le"],"choices":["le","la","les"]},{"id":"b2","answers":["l'"],"choices":["l'","le","la","les"]}],"verification":{"status":"verified","note":null},"match":null,"answers":{"confidence":"unanimous","explanation":"Dans l'expression figée « rester le bec dans l'eau », on met l'article défini « le » devant « bec » (masculin) et « l' » devant « eau » (féminin, élidé devant voyelle).","reference":null}},{"id":"01-e02a.4","context":null,"prompt":"Avoir ___ folie des grandeurs.","gradable":true,"blanks":[{"id":"b1","answers":["la"],"choices":["la","le","les"]}],"verification":{"status":"verified","note":null},"match":null,"answers":{"confidence":"unanimous","explanation":"L'expression « avoir la folie des grandeurs » emploie l'article défini « la » devant « folie », nom féminin singulier, car on parle d'une tendance générale et abstraite.","reference":null}}]},{"id":"01-e02b","label":"2","suffix":"b","type":"matching","instruction":"Reliez chaque expression à l'explication qui lui correspond.","context":null,"gradable":true,"section":"L'article indéfini/défini","items":[{"id":"01-e02b.1","context":null,"prompt":"___ nuit porte conseil.","gradable":true,"blanks":[],"verification":{"status":"verified","note":null},"match":{"options":["A. être stupéfait","B. avoir le goût de ce qui est colossal/avoir une ambition démesurée","C. C'est facile à comprendre.","D. Il faut attendre le lendemain avant de prendre une décision importante."],"answer":"D","variants":["D"]},"answers":{"confidence":"unanimous","explanation":"« La nuit porte conseil » est une expression figée avec l'article défini « la » ; elle signifie qu'il vaut mieux attendre le lendemain pour décider, car la réflexion nocturne aide à mieux juger.","reference":null}},{"id":"01-e02b.2","context":null,"prompt":"C'est clair comme ___ jour.","gradable":true,"blanks":[],"verification":{"status":"verified","note":null},"match":{"options":["A. être stupéfait","B. avoir le goût de ce qui est colossal/avoir une ambition démesurée","C. C'est facile à comprendre.","D. Il faut attendre le lendemain avant de prendre une décision importante."],"answer":"C","variants":["C"]},"answers":{"confidence":"unanimous","explanation":"Dans la comparaison figée « clair comme le jour », on emploie l'article défini « le » ; l'image du jour (la lumière) exprime que quelque chose est évident et facile à comprendre.","reference":null}},{"id":"01-e02b.3","context":null,"prompt":"Rester ___ bec dans ___ eau.","gradable":true,"blanks":[],"verification":{"status":"verified","note":null},"match":{"options":["A. être stupéfait","B. avoir le goût de ce qui est colossal/avoir une ambition démesurée","C. C'est facile à comprendre.","D. Il faut attendre le lendemain avant de prendre une décision importante."],"answer":"A","variants":["A"]},"answers":{"confidence":"unanimous","explanation":"« Rester le bec dans l'eau » est une expression idiomatique avec l'article défini « le » et « l' » ; elle décrit quelqu'un de stupéfait, décontenancé, comme un oiseau qui ne peut rien attraper.","reference":null}},{"id":"01-e02b.4","context":null,"prompt":"Avoir ___ folie des grandeurs.","gradable":true,"blanks":[],"verification":{"status":"verified","note":null},"match":{"options":["A. être stupéfait","B. avoir le goût de ce qui est colossal/avoir une ambition démesurée","C. C'est facile à comprendre.","D. Il faut attendre le lendemain avant de prendre une décision importante."],"answer":"B","variants":["B"]},"answers":{"confidence":"unanimous","explanation":"« Avoir la folie des grandeurs » est une expression figée avec l'article défini « la » ; elle désigne le goût du colossal et une ambition démesurée.","reference":null}}]},{"id":"01-e03","label":"3","suffix":null,"type":"open_question","instruction":"Utilisez les expressions de l'exercice 2 dans des mini-situations comme dans l'exemple proposé.","context":null,"gradable":false,"section":"L'article indéfini/défini","items":[{"id":"01-e03.1","context":null,"prompt":"On avait organisé un voyage au Brésil mais, après l'accident de Jules, notre projet est tombé à l'eau.","gradable":false,"blanks":[],"verification":null,"match":null,"answers":{"confidence":"reference","explanation":null,"reference":"On avait organisé un voyage au Brésil mais, après l'accident de Jules, notre projet est tombé à l'eau."}},{"id":"01-e03.2","context":null,"prompt":"Notre projet a échoué, n'a pas abouti.","gradable":false,"blanks":[],"verification":null,"match":null,"answers":{"confidence":"reference","explanation":null,"reference":"Notre projet est tombé à l'eau : il a échoué, il n'a pas abouti."}}]},{"id":"01-e04","label":"1","suffix":null,"type":"fill_blank","instruction":"Complétez avec l'article qui convient pour découvrir les représentations que les Français ont des animaux.","context":null,"gradable":true,"section":"Valeur généralisante des deux articles","items":[{"id":"01-e04.1","context":null,"prompt":"___ hirondelle annonce soit ___ printemps soit ___ automne.","gradable":true,"blanks":[{"id":"b1","answers":["L’"],"choices":["L’","Le","La"]},{"id":"b2","answers":["le"],"choices":["le","un","du","au"]},{"id":"b3","answers":["l’"],"choices":["l’","le","un","du"]}],"verification":{"status":"verified","note":"confirmé après arbitrage"},"match":null,"answers":{"confidence":"unanimous","explanation":"L'article défini « L' » devant « hirondelle » (élision devant voyelle) et « l' » devant « automne » donnent à ces noms une valeur générale : l'hirondelle en tant qu'espèce, l'automne en tant que saison. « Le printemps » garde aussi cette valeur générique.","reference":null}},{"id":"01-e04.2","context":null,"prompt":"___ coq signale ___ aube.","gradable":true,"blanks":[{"id":"b1","answers":["Le"],"choices":["Le","La","L’","Un"]},{"id":"b2","answers":["l’"],"choices":["l’","le","une","de la"]}],"verification":{"status":"verified","note":"confirmé après arbitrage"},"match":null,"answers":{"confidence":"unanimous","explanation":"« Le coq » désigne l'espèce entière (valeur généralisante), et « l' » devant « aube » est l'article défini élidé devant voyelle, avec un sens général : toute aube.","reference":null}},{"id":"01-e04.3","context":null,"prompt":"___ chouette symbolise ___ malheur.","gradable":true,"blanks":[{"id":"b1","answers":["La"],"choices":["La","Le","L’","Une"]},{"id":"b2","answers":["le"],"choices":["le","la","un","du"]}],"verification":{"status":"verified","note":"confirmé après arbitrage"},"match":null,"answers":{"confidence":"unanimous","explanation":"« La chouette » représente l'espèce (article défini généralisant) et « le malheur » est un nom abstrait pris dans un sens général, d'où l'article défini.","reference":null}},{"id":"01-e04.4","context":null,"prompt":"___ escargots arrivent après ___ pluie.","gradable":true,"blanks":[{"id":"b1","answers":["Les"],"choices":["Les","Le","Des"]},{"id":"b2","answers":["la"],"choices":["la","le","une","de la"]}],"verification":{"status":"verified","note":"confirmé après arbitrage"},"match":null,"answers":{"confidence":"unanimous","explanation":"« Les escargots » au pluriel avec l'article défini exprime une généralité (tous les escargots), et « la pluie » est un nom général désignant le phénomène, donc article défini.","reference":null}},{"id":"01-e04.5","context":null,"prompt":"___ grillon assure ___ bonheur dans ___ maison.","gradable":true,"blanks":[{"id":"b1","answers":["Le"],"choices":["Le","La","L’","Un"]},{"id":"b2","answers":["le"],"choices":["le","la","un","du"]},{"id":"b3","answers":["la"],"choices":["la","le","une","de la"]}],"verification":{"status":"verified","note":"confirmé après arbitrage"},"match":null,"answers":{"confidence":"unanimous","explanation":"« Le grillon » et « le bonheur » ont une valeur générique (l'espèce, le sentiment en général) ; « la maison » est précédé de l'article défini car il s'agit d'une maison quelconque mais typique dans ce contexte.","reference":null}},{"id":"01-e04.6","context":null,"prompt":"___ araignée ___ soir apporte ___ espoir.","gradable":true,"blanks":[{"id":"b1","answers":["L’"],"choices":["L’","Le","La","Une"]},{"id":"b2","answers":["du","le"],"choices":["du","de","au","un"]},{"id":"b3","answers":["l’"],"choices":["l’","le","un","du"]}],"verification":{"status":"verified","note":"confirmé après arbitrage"},"match":null,"answers":{"confidence":"arbitrated","explanation":"« L'araignée » (élision) a une valeur généralisante ; « du soir » est la contraction de « de + le soir » dans l'expression figée « l'araignée du soir » ; « l'espoir » (élision) est un nom abstrait pris généralement.","reference":null}},{"id":"01-e04.7","context":null,"prompt":"___ araignée ___ matin apporte ___ chagrin.","gradable":true,"blanks":[{"id":"b1","answers":["L’"],"choices":["L’","Le","La","Une"]},{"id":"b2","answers":["du"],"choices":["du","de","au","un"]},{"id":"b3","answers":["du"],"choices":["du","un","de"]}],"verification":{"status":"verified","note":"confirmé après arbitrage"},"match":null,"answers":{"confidence":"unanimous","explanation":"Comme dans l'expression symétrique, « l'araignée du matin » utilise l'article défini généralisant et la contraction « du » (de + le) ; « du chagrin » est un partitif car il s'agit d'une quantité indéterminée de chagrin, conformément à la formule figée.","reference":null}},{"id":"01-e04.8","context":null,"prompt":"___ agneau représente ___ douceur et ___ innocence.","gradable":true,"blanks":[{"id":"b1","answers":["L’"],"choices":["L’","Le","La","Un"]},{"id":"b2","answers":["la"],"choices":["la","le","une","de la"]},{"id":"b3","answers":["l’"],"choices":["l’","le","une","de l’"]}],"verification":{"status":"verified","note":"confirmé après arbitrage"},"match":null,"answers":{"confidence":"unanimous","explanation":"« L'agneau » (élision) représente l'espèce, tandis que « la douceur » et « l'innocence » (élision) sont des noms abstraits employés avec l'article défini pour exprimer des notions générales.","reference":null}}]},{"id":"01-e06","label":"3","suffix":null,"type":"fill_blank","instruction":"Complétez avec un, une, des ou le, la, les, puis trouvez deux phrases selon le même modèle.","context":null,"gradable":true,"section":"Valeur généralisante des deux articles","items":[{"id":"01-e06.1","context":null,"prompt":"___ malade a besoin d'attention mais ___ infirmières dans ___ hôpitaux ont trop de travail et ___ malades ne reçoivent pas toute ___ attention qu'ils voudraient.","gradable":true,"blanks":[{"id":"b1","answers":["Un","Le"],"choices":["Un","Une","Des","Les"]},{"id":"b2","answers":["les"],"choices":["les","des","une"]},{"id":"b3","answers":["les"],"choices":["les","des","un"]},{"id":"b4","answers":["les"],"choices":["les","des","un"]},{"id":"b5","answers":["l’"],"choices":["l’","une","la","les"]}],"verification":{"status":"verified","note":"1 variante(s) ajoutée(s)"},"match":null,"answers":{"confidence":"unanimous","explanation":"« Un malade » avec l'article indéfini présente un cas général : n'importe quel malade, pris comme représentant de la catégorie. Ensuite « les infirmières », « les hôpitaux » et « les malades » reprennent l'article défini pluriel pour désigner la catégorie entière, et « toute l'attention » emploie l'article défini car l'attention est déterminée par la relative « qu'ils voudraient ».","reference":null}},{"id":"01-e06.2","context":null,"prompt":"___ chien est ___ ami de ___ homme mais ___ chien par peur peut devenir agressif.","gradable":true,"blanks":[{"id":"b1","answers":["Le","Un"],"choices":["Le","Les","Des","Une"]},{"id":"b2","answers":["un"],"choices":["un","le","les","des"]},{"id":"b3","answers":["l’"],"choices":["l’","un","le","les"]},{"id":"b4","answers":["un","le"],"choices":["un","les","des","une"]}],"verification":{"status":"verified","note":"2 variante(s) ajoutée(s)"},"match":null,"answers":{"confidence":"unanimous","explanation":"« Le chien » avec l'article défini singulier exprime une vérité générale sur toute l'espèce, tandis que « un chien » (indéfini) dans la seconde partie renvoie à un chien quelconque, un cas particulier parmi les chiens. « Un ami de l'homme » : l'article défini « l' » marque l'espèce humaine dans son ensemble.","reference":null}},{"id":"01-e06.3","context":null,"prompt":"___ ambitieux a ___ dents longues mais pour réussir ___ ambitieux doivent être prudents et persévérants sinon ils peuvent se casser ___ dents.","gradable":true,"blanks":[{"id":"b1","answers":["Un"],"choices":["Un","Le","Les","Des"]},{"id":"b2","answers":["les"],"choices":["les","des","un"]},{"id":"b3","answers":["les"],"choices":["les","des","un"]},{"id":"b4","answers":["les"],"choices":["les","des","un"]}],"verification":{"status":"verified","note":"l'arbitre juge les deux réponses acceptables ; 0 variante(s) ajoutée(s)"},"match":null,"answers":{"confidence":"unanimous","explanation":"« Un ambitieux » (indéfini) sert à énoncer une règle valable pour tout ambitieux, puis « les ambitieux » (défini pluriel) désigne la catégorie entière. « Avoir les dents longues » et « se casser les dents » sont des expressions figées où l'article défini pluriel est obligatoire.","reference":null}},{"id":"01-e06.4","context":null,"prompt":"___ artiste doit avoir du temps à consacrer à son art mais ___ artistes en général sont obligés d'avoir ___ emploi régulier pour survivre.","gradable":true,"blanks":[{"id":"b1","answers":["Un","L'"],"choices":["Un","Les","Des","Une"]},{"id":"b2","answers":["les"],"choices":["les","des","un"]},{"id":"b3","answers":["un"],"choices":["un","le","les","des"]}],"verification":{"status":"verified","note":"1 variante(s) ajoutée(s)"},"match":null,"answers":{"confidence":"unanimous","explanation":"« Un artiste » avec l'indéfini présente le cas général d'un artiste quelconque, alors que « les artistes en général » emploie le défini pluriel pour toute la catégorie. « Un emploi régulier » reste indéfini car il s'agit d'un emploi parmi d'autres, non précisé.","reference":null}},{"id":"01-e06.5","context":null,"prompt":"___ danseur est un sportif de haut niveau, en effet ___ danseurs sont ___ athlètes qui doivent avoir ___ entraînement quotidien.","gradable":true,"blanks":[{"id":"b1","answers":["Un","Le"],"choices":["Un","Les","Des","Une"]},{"id":"b2","answers":["les"],"choices":["les","des","un"]},{"id":"b3","answers":["des"],"choices":["des","les","un","une"]},{"id":"b4","answers":["un"],"choices":["un","le","les","des"]}],"verification":{"status":"verified","note":null},"match":null,"answers":{"confidence":"arbitrated","explanation":"« Un danseur » (indéfini) énonce une vérité valable pour n'importe quel danseur, puis « les danseurs » (défini pluriel) reprend la catégorie entière. « Des athlètes » est indéfini pluriel car on classe les danseurs dans un groupe, et « un entraînement quotidien » reste indéfini car il n'est pas déterminé.","reference":null}}]},{"id":"01-e07","label":"4","suffix":null,"type":"open","instruction":"Lisez ces exemples qui contiennent des expressions imagées et trouvez leur sens.","context":null,"gradable":false,"section":"Valeur généralisante des deux articles","items":[{"id":"01-e07.1","context":null,"prompt":"Le voyage en Inde nous coûtera 2 000 euros chacun. Si on veut partir, il faudra se serrer la ceinture pendant toute l'année.","gradable":false,"blanks":[],"verification":null,"match":null,"answers":{"confidence":null,"explanation":null,"reference":null}},{"id":"01-e07.2","context":null,"prompt":"Se serrer la ceinture : ___","gradable":false,"blanks":[{"id":"b1","answers":[],"choices":null}],"verification":null,"match":null,"answers":{"confidence":"reference","explanation":null,"reference":"Se priver, réduire son budget, faire des économies (par manque d'argent)."}},{"id":"01-e07.3","context":null,"prompt":"Ce problème de maths est très compliqué. J'ai beau me casser la tête, je ne trouve pas la solution.","gradable":false,"blanks":[],"verification":null,"match":null,"answers":{"confidence":null,"explanation":null,"reference":null}},{"id":"01-e07.4","context":null,"prompt":"Se casser la tête : ___","gradable":false,"blanks":[{"id":"b1","answers":[],"choices":null}],"verification":null,"match":null,"answers":{"confidence":"reference","explanation":null,"reference":"Se fatiguer à réfléchir, faire de gros efforts intellectuels pour trouver quelque chose."}},{"id":"01-e07.5","context":null,"prompt":"Elle ne supporte pas d'être contredite et sa stratégie est de faire la sourde oreille quand on n'est pas de son avis.","gradable":false,"blanks":[],"verification":null,"match":null,"answers":{"confidence":null,"explanation":null,"reference":null}},{"id":"01-e07.6","context":null,"prompt":"Faire la sourde oreille : ___","gradable":false,"blanks":[{"id":"b1","answers":[],"choices":null}],"verification":null,"match":null,"answers":{"confidence":"reference","explanation":null,"reference":"Faire semblant de ne pas entendre, refuser d'écouter."}}]},{"id":"01-e08","label":"1","suffix":null,"type":"fill_blank","instruction":"Complétez avec les articles définis, indéfinis ou partitifs qui conviennent.","context":null,"gradable":true,"section":"L'article partitif","items":[{"id":"01-e08.1","context":null,"prompt":"– Tu fais ___ régime ?","gradable":true,"blanks":[{"id":"b1","answers":["un"],"choices":["un","le","du"]}],"verification":{"status":"verified","note":null},"match":null,"answers":{"confidence":"unanimous","explanation":"« Faire un régime » est une expression figée avec l'article indéfini « un » ; on parle d'un régime parmi d'autres, non d'une quantité de régime.","reference":null}},{"id":"01-e08.2","context":null,"prompt":"– Ne m'en parle pas. Je n'ai pas ___ droit de manger ___ sucreries : ___ confiture, ___ chocolat, ___ gâteaux et surtout pas ___ sucre dans le café. Je n'ai pas le droit de manger ___ féculents. Fini ___ pâtes à l'italienne, ___ gros haricots blancs, ___ pommes de terre en robe des champs avec ___ beurre et ___ bon pain frais. ___ huile dans ___ salade ? Pas question, pas ___ matières grasses non plus. Je n'ai pas ___ droit de boire ___ vin, mais ___ lait ou ___ jus de fruits, ___ eau à volonté. Pouah !","gradable":true,"blanks":[{"id":"b1","answers":["le"],"choices":["le","un","du"]},{"id":"b2","answers":["des","de"],"choices":["des","les","de la","du"]},{"id":"b3","answers":["de la","la"],"choices":["de la","du","des","le"]},{"id":"b4","answers":["du","le"],"choices":["du","de la","des","au"]},{"id":"b5","answers":["des","les"],"choices":["des","de","du","de la"]},{"id":"b6","answers":["de"],"choices":["de","du","des"]},{"id":"b7","answers":["des","de"],"choices":["des","les","du","de la"]},{"id":"b8","answers":["les"],"choices":["les","des","du"]},{"id":"b9","answers":["les"],"choices":["les","des","du"]},{"id":"b10","answers":["les"],"choices":["les","des","du"]},{"id":"b11","answers":["du"],"choices":["du","le","de","des"]},{"id":"b12","answers":["du"],"choices":["du","le","de","des"]},{"id":"b13","answers":["De l’","L’"],"choices":["De l’","du","la"]},{"id":"b14","answers":["la"],"choices":["la","de la","du","une"]},{"id":"b15","answers":["de"],"choices":["de","du","de la"]},{"id":"b16","answers":["le"],"choices":["le","du","un"]},{"id":"b17","answers":["du","de"],"choices":["du","le","des","de la"]},{"id":"b18","answers":["du"],"choices":["du","le","de","des"]},{"id":"b19","answers":["du"],"choices":["du","le","de","des"]},{"id":"b20","answers":["de l’"],"choices":["de l’","du","la","de la"]}],"verification":{"status":"verified","note":null},"match":null,"answers":{"confidence":"arbitrated","explanation":"« Avoir le droit de » se construit avec l'article défini « le » ; après « manger », les aliments indénombrables (confiture, chocolat, sucre, beurre, huile, vin, lait, eau…) prennent le partitif (de la, du, de l'), tandis que les aliments comptables au pluriel (sucreries, gâteaux, féculents, pâtes, haricots, pommes de terre) prennent « des ». Après une négation, « des » et les partitifs deviennent « de » (pas de sucre, pas de matières grasses). « Fini » est suivi de l'article défini « les » pour désigner des catégories entières (les pâtes, les haricots, les pommes de terre).","reference":null}},{"id":"01-e08.3","context":null,"prompt":"– Et ___ viande, tu peux en manger ?","gradable":true,"blanks":[{"id":"b1","answers":["de la","la"],"choices":["de la","du","des","le"]}],"verification":{"status":"verified","note":null},"match":null,"answers":{"confidence":"arbitrated","explanation":"« De la viande » est un partitif car la viande est indénombrable ; on en mange une quantité indéterminée.","reference":null}},{"id":"01-e08.4","context":null,"prompt":"– Tu n'y penses pas. ___ bœuf, ___ mouton, ___ veau, ___ porc, il y a longtemps que je ne sais plus ce que c'est.","gradable":true,"blanks":[{"id":"b1","answers":["Le","du"],"choices":["Le","la","des","un"]},{"id":"b2","answers":["le","du"],"choices":["le","la","des","un"]},{"id":"b3","answers":["le","du"],"choices":["le","la","des","un"]},{"id":"b4","answers":["le","du"],"choices":["le","la","des","un"]}],"verification":{"status":"verified","note":null},"match":null,"answers":{"confidence":"arbitrated","explanation":"Ici « le bœuf, le mouton, le veau, le porc » désignent des catégories de viande en général, d'où l'article défini « le » à chaque fois.","reference":null}},{"id":"01-e08.5","context":null,"prompt":"– Mais alors qu'est-ce que tu manges?","gradable":false,"blanks":[],"verification":null,"match":null,"answers":{"confidence":null,"explanation":null,"reference":null}},{"id":"01-e08.6","context":null,"prompt":"– Eh bien, en dehors de tout ça, je peux manger ce que je veux.","gradable":false,"blanks":[],"verification":null,"match":null,"answers":{"confidence":null,"explanation":null,"reference":null}}]},{"id":"01-e09","label":"2","suffix":null,"type":"fill_blank","instruction":"Complétez avec les articles qui conviennent.","context":null,"gradable":true,"section":"L'article partitif","items":[{"id":"01-e09.1","context":null,"prompt":"– Tu veux faire ___ sport. Bien, mais quel sport ?","gradable":true,"blanks":[{"id":"b1","answers":["du"],"choices":["du","le","de","un"]}],"verification":{"status":"verified","note":null},"match":null,"answers":{"confidence":"unanimous","explanation":"« Faire » suivi d'un nom de sport indénombrable (on ne dit pas « un sport » ici, mais l'activité en général) demande le partitif « du » (de + le).","reference":null}},{"id":"01-e09.2","context":null,"prompt":"– ___ rugby et ___ voile.","gradable":true,"blanks":[{"id":"b1","answers":["Du"],"choices":["Du","De","Un"]},{"id":"b2","answers":["de la"],"choices":["de la","du","une"]}],"verification":{"status":"verified","note":null},"match":null,"answers":{"confidence":"unanimous","explanation":"« Rugby » est masculin, donc partitif « du » ; « voile » est féminin, donc partitif « de la ». On parle de la pratique de ces activités en général.","reference":null}},{"id":"01-e09.3","context":null,"prompt":"– Faire ___ planche à voile à la montagne, ce n'est pas évident. Tu ferais mieux de faire ___ ski.","gradable":true,"blanks":[{"id":"b1","answers":["de la"],"choices":["de la","la","du","une"]},{"id":"b2","answers":["du"],"choices":["du","le","de la","un"]}],"verification":{"status":"verified","note":null},"match":null,"answers":{"confidence":"unanimous","explanation":"« Planche à voile » est féminin → « de la » ; « ski » est masculin → « du ». Le partitif s'emploie avec « faire » pour désigner une activité.","reference":null}},{"id":"01-e09.4","context":null,"prompt":"– Pourquoi pas ? J'aime bien ___ sports de glisse.","gradable":true,"blanks":[{"id":"b1","answers":["les"],"choices":["les","des"]}],"verification":{"status":"verified","note":null},"match":null,"answers":{"confidence":"unanimous","explanation":"Avec « aimer bien » suivi d'un nom pluriel désignant une catégorie (les sports de glisse en général), on emploie l'article défini « les », pas le partitif.","reference":null}},{"id":"01-e09.5","context":null,"prompt":"– Bien, mais avant de faire ___ sport, il faut ___ entraînement.","gradable":true,"blanks":[{"id":"b1","answers":["du"],"choices":["du","le","de","un"]},{"id":"b2","answers":["de l’"],"choices":["de l’","de la","du"]}],"verification":{"status":"verified","note":null},"match":null,"answers":{"confidence":"unanimous","explanation":"« Sport » est masculin → « du » ; « entraînement » commence par une voyelle → « de l' ». Le partitif présente ces noms comme des quantités non comptées.","reference":null}},{"id":"01-e09.6","context":null,"prompt":"– L'un n'empêche pas l'autre, non ?","gradable":false,"blanks":[],"verification":null,"match":null,"answers":{"confidence":null,"explanation":null,"reference":null}}]},{"id":"01-e10","label":"3","suffix":null,"type":"fill_blank","instruction":"Même exercice.","context":null,"gradable":true,"section":"L'article partitif","items":[{"id":"01-e10.1","context":null,"prompt":"J'en ai marre. Entre ___ courses, ___ ménage, ___ lavage, ___ repassage, ___ vaisselle, ___ repas, je ne m'en sors pas. Et dire qu'il y a ___ gens qui prétendent que ___ travail de ___ maison est ___ plus tranquille et ___ moins fatigant !","gradable":true,"blanks":[{"id":"b1","answers":["les"],"choices":["les","des"]},{"id":"b2","answers":["le"],"choices":["le","la","les","un"]},{"id":"b3","answers":["le"],"choices":["le","la","les","du"]},{"id":"b4","answers":["le"],"choices":["le","la","les","un"]},{"id":"b5","answers":["la"],"choices":["la","le","les","une"]},{"id":"b6","answers":["les"],"choices":["les","le","la","des"]},{"id":"b7","answers":["des"],"choices":["des","les","de"]},{"id":"b8","answers":["le"],"choices":["le","la","les","un"]},{"id":"b9","answers":["la"],"choices":["la","le","les","une"]},{"id":"b10","answers":["le"],"choices":["le","la","les","un"]},{"id":"b11","answers":["le"],"choices":["le","la","les","un"]}],"verification":{"status":"verified","note":"confirmé après arbitrage"},"match":null,"answers":{"confidence":"unanimous","explanation":"Ici on n'énumère pas des quantités mais des activités précises et connues (les courses, le ménage, la vaisselle…), donc on emploie l'article défini (le, la, les) et non le partitif ; « des gens » est un pluriel indéfini, « le travail de la maison » désigne une activité générale, et « le plus tranquille / le moins fatigant » est un superlatif qui prend l'article défini.","reference":null}}]},{"id":"01-e11","label":"4","suffix":null,"type":"fill_blank","instruction":"Même exercice.","context":null,"gradable":true,"section":"L'article partitif","items":[{"id":"01-e11.1","context":null,"prompt":"À côté de chez moi il y a une boucherie qui vend ___ bœuf excellent.","gradable":true,"blanks":[{"id":"b1","answers":["du"],"choices":["du","le","de","un"]}],"verification":{"status":"verified","note":null},"match":null,"answers":{"confidence":"unanimous","explanation":"On parle d'une quantité indéterminée de bœuf (une matière, une substance) : on emploie donc l'article partitif « du ».","reference":null}},{"id":"01-e11.2","context":null,"prompt":"Connaissez-vous la fable de La Fontaine, « La Grenouille qui voulait se faire aussi grosse que ___ bœuf » ?","gradable":true,"blanks":[{"id":"b1","answers":["le"],"choices":["le","du","un"]}],"verification":{"status":"verified","note":null},"match":null,"answers":{"confidence":"unanimous","explanation":"Il s'agit ici du bœuf en général, pris comme un tout, et non d'une quantité : on utilise l'article défini « le ».","reference":null}},{"id":"01-e11.3","context":null,"prompt":"À la cantine, on sert souvent ___ poulet.","gradable":true,"blanks":[{"id":"b1","answers":["du"],"choices":["du","le","de","un"]}],"verification":{"status":"verified","note":null},"match":null,"answers":{"confidence":"unanimous","explanation":"« Du poulet » est un partitif : on désigne une portion indéterminée de cette viande servie à la cantine.","reference":null}},{"id":"01-e11.4","context":null,"prompt":"Dans cette ferme, ___ poulets sont élevés en plein air.","gradable":true,"blanks":[{"id":"b1","answers":["les","des"],"choices":["les","du","un"]}],"verification":{"status":"verified","note":"deux formes acceptables : « les » conservé en tête, « des » ajouté (règle 3b : pas de correction sans faute établie) — L'article partitif 'des' exprime une quantité indéfinie, adapté ici."},"match":null,"answers":{"confidence":"unanimous","explanation":"On emploie l'article défini « les » parce qu'il s'agit de tous les poulets de cette ferme, pris dans leur ensemble : on parle d'une généralité bien définie par le contexte « dans cette ferme », et non d'une quantité indéterminée (qui appellerait le partitif « des »).","reference":null}},{"id":"01-e11.5","context":null,"prompt":"Dans ce restaurant, il y a toujours ___ poisson très frais.","gradable":true,"blanks":[{"id":"b1","answers":["du"],"choices":["du","le","de","un"]}],"verification":{"status":"verified","note":null},"match":null,"answers":{"confidence":"unanimous","explanation":"« Du poisson » exprime une quantité indéterminée de poisson frais, d'où le partitif.","reference":null}},{"id":"01-e11.6","context":null,"prompt":"Quand il fait très chaud, ___ poissons ne s'approchent pas du rivage.","gradable":true,"blanks":[{"id":"b1","answers":["les"],"choices":["les","des","du"]}],"verification":{"status":"verified","note":null},"match":null,"answers":{"confidence":"unanimous","explanation":"« Les poissons » renvoie à des animaux comptables et identifiables (tous les poissons), donc article défini pluriel.","reference":null}}]},{"id":"01-e12","label":"1","suffix":null,"type":"fill_blank","instruction":"Complétez ce texte par des articles.","context":null,"gradable":true,"section":"L'absence d'article","items":[{"id":"01-e12.1","context":null,"prompt":"– Docteur, ça ne va pas.","gradable":false,"blanks":[],"verification":null,"match":null,"answers":{"confidence":null,"explanation":null,"reference":null}},{"id":"01-e12.2","context":null,"prompt":"– Dans votre cas, ___ choses sont simples : plus ___ cigarettes, plus ___ apéritifs, plus ___ bons repas bien arrosés, ni ___ café et encore moins ___ pousse-café, mais par contre ___ sport et ___ marche. Pas ___ efforts violents et courts mais ___ efforts progressifs, tous ___ jours. Vous verrez, ça ira mieux très vite.","gradable":true,"blanks":[{"id":"b1","answers":["les"],"choices":["les","des"]},{"id":"b2","answers":["de"],"choices":["de","des","du"]},{"id":"b3","answers":["d’"],"choices":["d’","de","des"]},{"id":"b4","answers":["de"],"choices":["de","des","du"]},{"id":"b5","answers":["de"],"choices":["de","des"]},{"id":"b6","answers":["de"],"choices":["de","des","du"]},{"id":"b7","answers":["du"],"choices":["du","de","des","le"]},{"id":"b8","answers":["de la"],"choices":["de la","du","des","de"]},{"id":"b9","answers":["d’"],"choices":["d’","de","des"]},{"id":"b10","answers":["des"],"choices":["des","de","les","du"]},{"id":"b11","answers":["les"],"choices":["les","des"]}],"verification":{"status":"verified","note":null},"match":null,"answers":{"confidence":"unanimous","explanation":"« Les choses » : on parle de choses déterminées (dans votre cas), donc article défini. Après « plus » au sens de « ne plus avoir de », on emploie « de » (plus de cigarettes, plus d'apéritifs, plus de bons repas, ni de café, encore moins de pousse-café) : la négation remplace l'article indéfini par « de ». En revanche, « du sport » et « de la marche » gardent l'article partitif car on exprime ce qu'il faut faire (quantité positive). « Pas d'efforts violents » : négation, donc « de » ; « des efforts progressifs » : affirmation avec un nom pluriel déterminé par l'adjectif, on garde « des ». Enfin « tous les jours » est une expression figée avec article défini.","reference":null}}]},{"id":"01-e13","label":"2","suffix":null,"type":"fill_blank","instruction":"Complétez ce texte par des articles si nécessaire.","context":null,"gradable":true,"section":"L'absence d'article","items":[{"id":"01-e13.1","context":null,"prompt":"– Tu as ___ beau jardin. Moi je ne cultive ni ___ plantes, ni ___ légumes. Je sais faire ___ différence entre ___ persil et ___ salade mais c'est tout.","gradable":true,"blanks":[{"id":"b1","answers":["un"],"choices":["un","le","des"]},{"id":"b2","answers":["∅","Ø"],"choices":["∅","des","les"]},{"id":"b3","answers":["∅","Ø"],"choices":["∅","des","les"]},{"id":"b4","answers":["la"],"choices":["la","une","de la","des"]},{"id":"b5","answers":["le"],"choices":["le","un","du","des"]},{"id":"b6","answers":["la"],"choices":["la","une","de la","des"]}],"verification":{"status":"verified","note":null},"match":null,"answers":{"confidence":"arbitrated","explanation":"« Un beau jardin » : article indéfini devant un nom singulier qu'on présente. Après « ni », l'article indéfini pluriel disparaît : « ni plantes, ni légumes ». « Faire la différence » est une expression figée avec l'article défini. Devant les noms de plantes et d'aliments pris en général, on met le défini : « le persil », « la salade ».","reference":null}},{"id":"01-e13.2","context":null,"prompt":"– Ici, tu as ___ salade, mais là, c'est ___ romaine, et là, ___ frisée.","gradable":true,"blanks":[{"id":"b1","answers":["de la"],"choices":["de la","la","une","des"]},{"id":"b2","answers":["de la"],"choices":["de la","la","une","des"]},{"id":"b3","answers":["de la"],"choices":["de la","la","une","des"]}],"verification":{"status":"verified","note":null},"match":null,"answers":{"confidence":"unanimous","explanation":"On emploie le partitif « de la » devant un nom non comptable (salade, romaine, frisée) pour désigner une quantité indéterminée de cette matière.","reference":null}},{"id":"01-e13.3","context":null,"prompt":"– Tu as ___ fruits ?","gradable":true,"blanks":[{"id":"b1","answers":["des"],"choices":["des","les","de"]}],"verification":{"status":"verified","note":null},"match":null,"answers":{"confidence":"unanimous","explanation":"« Des fruits » : article indéfini pluriel, car il s'agit d'une quantité non précisée d'objets comptables.","reference":null}},{"id":"01-e13.4","context":null,"prompt":"– Là bas, j'ai ___ vigne mais je ne fais plus ___ fraises ni ___ framboises depuis l'an dernier. Je n'ai pas ___ arbres fruitiers : ni ___ pommiers, ni ___ poiriers, ni ___ pêchers. Rien. Ici, ils n'ont aucune ___ chance de pousser. En planter serait sans ___ intérêt.","gradable":true,"blanks":[{"id":"b1","answers":["une"],"choices":["une","de la","des"]},{"id":"b2","answers":["de"],"choices":["de","des","de la"]},{"id":"b3","answers":["de"],"choices":["de","des","de la"]},{"id":"b4","answers":["d’"],"choices":["d’","des","de"]},{"id":"b5","answers":["∅","Ø"],"choices":["∅","des","les"]},{"id":"b6","answers":["∅","Ø"],"choices":["∅","des","les"]},{"id":"b7","answers":["∅","Ø"],"choices":["∅","des","les"]},{"id":"b8","answers":["∅","Ø"],"choices":["∅","une","la","de la"]},{"id":"b9","answers":["∅","Ø"],"choices":["∅","un","le","du"]}],"verification":{"status":"verified","note":"confirmé après arbitrage"},"match":null,"answers":{"confidence":"arbitrated","explanation":"« Une vigne » : indéfini singulier pour présenter un élément. Après « ne… plus » et « ne… pas », l'indéfini pluriel et le partitif deviennent « de » (ou « d' » devant voyelle) : « de fraises », « de framboises », « d'arbres fruitiers ». Après « ni », l'article indéfini pluriel s'efface : « ni pommiers, ni poiriers, ni pêchers ». « Aucune chance » garde « aucune » car c'est un déterminant négatif. « Sans intérêt » : après la préposition « sans », le nom s'emploie sans article.","reference":null}}]},{"id":"01-e14","label":"3","suffix":null,"type":"fill_blank","instruction":"Complétez ce texte par des articles.","context":null,"gradable":true,"section":"L'absence d'article","items":[{"id":"01-e14.1","context":null,"prompt":"Mesdames et messieurs, ce n'est pas ___ enfant que vous avez devant vous. C'est ___ être capable de calculer plus vite qu' ___ ordinateur. C'est ___ être capable d'extraire ___ racine carrée plus vite que ___ machine. Ce n'est pas ___ enfant, c'est ___ génie. C'est ___ génie ___ calcul mental !","gradable":true,"blanks":[{"id":"b1","answers":["un"],"choices":["un","le","des"]},{"id":"b2","answers":["un"],"choices":["un","le","des"]},{"id":"b3","answers":["un"],"choices":["un","le","des"]},{"id":"b4","answers":["un"],"choices":["un","le","des"]},{"id":"b5","answers":["une","la"],"choices":["une","le","des"]},{"id":"b6","answers":["une"],"choices":["une","le","des"]},{"id":"b7","answers":["un"],"choices":["un","le","des"]},{"id":"b8","answers":["un"],"choices":["un","le","des"]},{"id":"b9","answers":["un"],"choices":["un","le","des"]},{"id":"b10","answers":["du"],"choices":["du","de","le","des"]}],"verification":{"status":"verified","note":null},"match":null,"answers":{"confidence":"arbitrated","explanation":"Ici chaque nom est présenté comme un élément nouveau et comptable (un enfant, un être, un ordinateur, une racine carrée, une machine, un génie), d'où l'article indéfini ; « du calcul mental » emploie l'article partitif contracté (de + le) pour indiquer le domaine dans l'expression figée « un génie du calcul mental ».","reference":null}}]},{"id":"01-e15","label":"4","suffix":null,"type":"fill_blank","instruction":"Même exercice.","context":null,"gradable":true,"section":"L'absence d'article","items":[{"id":"01-e15.1","context":null,"prompt":"– Tu viens avec nous ? On va passer ___ week-end à ___ campagne.","gradable":true,"blanks":[{"id":"b1","answers":["le"],"choices":["le","un","du","au"]},{"id":"b2","answers":["la"],"choices":["la","une","de la","à la"]}],"verification":{"status":"verified","note":null},"match":null,"answers":{"confidence":"unanimous","explanation":"On emploie l'article défini « le » devant « week-end » pour désigner un moment précis et connu (celui de ce week-end), et « la » devant « campagne » car on parle d'un lieu défini par l'usage : « aller à la campagne » est une expression courante avec article défini.","reference":null}},{"id":"01-e15.2","context":null,"prompt":"– Pardonne-moi, mais je n'aime pas ___ campagne ; je n'aime ni ___ odeur de ___ herbe mouillée, ni celle ___ vaches. Je n'aime ni ___ chant ___ coq, ni ___ chant ___ petits oiseaux, ni ___ coin-coin permanents ___ canards. J'aime ___ bruit ___ vagues sur ___ sable. J'aime ___ horizons infinis et ___ nuages, ___ merveilleux nuages. Quand vous irez à ___ mer, faites-moi signe.","gradable":false,"blanks":[{"id":"b1","answers":[],"choices":null},{"id":"b2","answers":[],"choices":null},{"id":"b3","answers":[],"choices":null},{"id":"b4","answers":[],"choices":null},{"id":"b5","answers":[],"choices":null},{"id":"b6","answers":[],"choices":null},{"id":"b7","answers":[],"choices":null},{"id":"b8","answers":[],"choices":null},{"id":"b9","a ill_blank","instruction":"Complétez ce texte avec des articles si nécessaire.","context":null,"gradable":true,"section":"L'absence d'article","items":[{"id":"01-e17.1","context":null,"prompt":"Il n'y avait qu' ___ petite centaine ___ personnes à ___ manifestation de soutien ___ sans-logis et surtout, pas assez ___ responsables politiques, pas assez ___ responsables syndicaux. Ce soir-là, ___ sans-logis avaient bien peu ___ amis. Par contre, en face, il y avait plus ___ une centaine ___ policiers. C'était bien triste !","gradable":true,"blanks":[{"id":"b1","answers":["une"],"choices":["une","des","la"]},{"id":"b2","answers":["de"],"choices":["de","des","de la"]},{"id":"b3","answers":["la"],"choices":["la","une","de la","des"]},{"id":"b4","answers":["aux"],"choices":["aux","de","les"]},{"id":"b5","answers":["de"],"choices":["de","des","aux"]},{"id":"b6","answers":["de"],"choices":["de","des","aux"]},{"id":"b7","answers":["les"],"choices":["les","des","aux"]},{"id":"b8","answers":["d’"],"choices":["d’","des","de"]},{"id":"b9","answers":["d’"],"choices":["d’","des"]},{"id":"b10","answers":["de"],"choices":["de","des","d’"]}],"verification":{"status":"verified","note":null},"match":null,"answers":{"confidence":"unanimous","explanation":"On emploie « une » devant « petite centaine » car c'est un nom comptable introduit par un déterminant indéfini ; « de » après « centaine » et après « pas assez » (quantité indéterminée) ; « la » devant « manifestation » (déterminée) ; « aux » dans « aux sans-logis » (à + les, complément de « soutien ») ; « les » devant « sans-logis » car on parle d'un groupe précis ; « d' » devant « amis » après « peu » et devant « une » après « plus » (comparatif de quantité) ; et « de » après « une centaine » pour exprimer la quantité.","reference":null}}]},{"id":"01-e18","label":"2","suffix":null,"type":"fill_blank","instruction":"Même exercice.","context":null,"gradable":true,"section":"L'absence d'article","items":[{"id":"01-e18.1","context":null,"prompt":"– Vous qui avez connu M. Dubois, la victime, pouvez-vous me dire ce qu'il faisait habituellement ?","gradable":false,"blanks":[],"verification":null,"match":null,"answers":{"confidence":null,"explanation":null,"reference":null}},{"id":"01-e18.2","context":null,"prompt":"– ___ plupart ___ temps, il était dans ___ jardin qui est derrière ___ maison.","gradable":true,"blanks":[{"id":"b1","answers":["La"],"choices":["La","Le","Une","Des"]},{"id":"b2","answers":["du"],"choices":["du","de","le","au"]},{"id":"b3","answers":["le"],"choices":["le","un","du","au"]},{"id":"b4","answers":["la"],"choices":["la","une","de la","le"]}],"verification":{"status":"verified","note":null},"match":null,"answers":{"confidence":"unanimous","explanation":"« La plupart » est toujours suivi de « de » + article défini : on dit « la plupart du temps » (partitif contracté). « Le jardin » et « la maison » sont des noms déterminés et précis, donc on garde l'article défini.","reference":null}},{"id":"01-e18.3","context":null,"prompt":"– Comme ___ moitié ___ année il pleut, que faisait-il alors ?","gradable":true,"blanks":[{"id":"b1","answers":["la"],"choices":["la","une","de la","le"]},{"id":"b2","answers":["de l’"],"choices":["de l’","du","au","de la"]}],"verification":{"status":"verified","note":null},"match":null,"answers":{"confidence":"unanimous","explanation":"« La moitié de » exprime une fraction : on emploie « de » + article défini, et « de l' » devant une voyelle (« de l'année »).","reference":null}},{"id":"01-e18.4","context":null,"prompt":"– ___ autre moitié ___ année, il la passait à lire derrière ___ fenêtre ___ salon. Il levait ___ tête de temps en temps et regardait passer ___ bateaux. ___ majorité ___ bateliers le connaissait. ___ plupart ___ temps, ils échangeaient ___ signe d'amitié.","gradable":true,"blanks":[{"id":"b1","answers":["L’"],"choices":["L’","Le","Une","Un"]},{"id":"b2","answers":["de l’"],"choices":["de l’","du","au","de la"]},{"id":"b3","answers":["la"],"choices":["la","une","de la","le"]},{"id":"b4","answers":["du"],"choices":["du","de","le","au"]},{"id":"b5","answers":["la"],"choices":["la","une","de la","le"]},{"id":"b6","answers":["des","les"],"choices":["des","de","aux","du"]},{"id":"b7","answers":["La"],"choices":["La","Le","Une","Des"]},{"id":"b8","answers":["des"],"choices":["des","de","les","du"]},{"id":"b9","answers":["La"],"choices":["La","Le","Une","Des"]},{"id":"b10","answers":["du"],"choices":["du","de","le","au"]},{"id":"b11","answers":["un"],"choices":["un","le","du","des"]}],"verification":{"status":"verified","note":null},"match":null,"answers":{"confidence":"arbitrated","explanation":"« L'autre moitié de l'année » : « autre » garde l'article défini et « de l' » se place devant la voyelle. « La fenêtre du salon » utilise « du » (de + le) pour indiquer l'appartenance. « La tête » est un article défini à valeur générale (partie du corps). « Des bateaux » est un article indéfini pluriel (quantité non précisée). « La majorité des bateliers » : « des » = de + les après un nom de quantité. « La plupart du temps » est l'expression figée avec « du ». « Un signe d'amitié » emploie l'article indéfini « un » pour un élément non spécifique.","reference":null}}]},{"id":"01-e19","label":"3","suffix":null,"type":"fill_blank","instruction":"Complétez ce texte avec des articles et la préposition « de ».","context":null,"gradable":true,"section":"L'absence d'article","items":[{"id":"01-e19.1","context":null,"prompt":"___ propriété était entourée ___ champs remplis ___ fleurs au printemps. ___ entrée était ornée ___ grille en fer forgé. Comme ___ maison était entourée ___ arbres, on ne la voyait pas de ___ entrée. Ce lieu était plein ___ charme, accompagné ___ certaine tristesse.","gradable":true,"blanks":[{"id":"b1","answers":["La"],"choices":["La","Une","Le","Les"]},{"id":"b2","answers":["de"],"choices":["de","des","par","à"]},{"id":"b3","answers":["de"],"choices":["de","des","par","avec"]},{"id":"b4","answers":["L’"]," ":null,"prompt":"Il a failli se noyer en faisant de la planche à voile.","gradable":true,"blanks":[],"verification":null,"match":null,"answers":{"confidence":"arbitrated","explanation":"Le gérondif « en faisant » indique seulement ce qui se passait au même moment que l'action principale (se noyer), sans idée de cause ni de moyen : c'est la simultanéité.","reference":null}},{"id":"09-e03.2","context":null,"prompt":"Elle ne se concentre pas assez en prenant ses cours.","gradable":true,"blanks":[],"verification":null,"match":null,"answers":{"confidence":"arbitrated","explanation":"« En prenant ses cours » situe simplement le moment où elle ne se concentre pas assez ; les deux actions sont simultanées, d'où la simple simultanéité.","reference":null}},{"id":"09-e03.3","context":null,"prompt":"En ne jetant pas l'argent par les fenêtres, il aurait moins de soucis.","gradable":true,"blanks":[],"verification":null,"match":null,"answers":{"confidence":"unanimous","explanation":"Le gérondif précédé de « en » peut exprimer une hypothèse : « en ne jetant pas l'argent par les fenêtres » équivaut à « si il ne jetait pas… », c'est donc une condition.","reference":null}},{"id":"09-e03.4","context":null,"prompt":"Fais attention en lui parlant ; il est susceptible.","gradable":true,"blanks":[],"verification":null,"match":null,"answers":{"confidence":"unanimous","explanation":"« En lui parlant » indique l'action pendant laquelle il faut faire attention ; il y a seulement coexistence des deux actions, donc simple simultanéité.","reference":null}},{"id":"09-e03.5","context":null,"prompt":"En travaillant trop, elle a fini par avoir une dépression.","gradable":true,"blanks":[],"verification":null,"match":null,"answers":{"confidence":"unanimous","explanation":"« En travaillant trop » est la raison de la dépression : on peut le remplacer par « parce qu'elle a travaillé trop », c'est donc une cause.","reference":null}},{"id":"09-e03.6","context":null,"prompt":"Il est très heureux tout en ayan :"3","suffix":null,"type":"transformation","instruction":"Réécrivez ce texte au passé et faites les accords si nécessaire.","context":null,"word_bank":null,"gradable":false,"section":"LA FORME PRONOMINALE","items":[{"id":"12-e03.1","context":null,"prompt":"Elle se lave les dents puis se brosse les cheveux avant de se mettre du rouge aux lèvres. Elle se regarde dans sa glace et se demande comment effacer ces petites rides aux coins de sa bouche et de ses yeux.","gradable":false,"blanks":[],"verification":null,"match":null,"answers":{"confidence":"reference","explanation":null,"reference":"Elle s’est lavé les dents puis s’est brossé les cheveux avant de se mettre du rouge aux lèvres. Elle s’est regardée dans sa glace et s’est demandé comment effacer ces petites rides aux coins de sa bouche et de ses yeux."}}]},{"id":"12-e04a","label":"4","suffix":"a","type":"transformation","instruction":"Soulignez dans ce texte les verbes qui ne sont pas réciproques.","context":null,"word_bank":null,"gradable":false,"section":"LA FORME PRONOMINALE","items":[{"id":"12-e04a.1","context":null,"prompt":"Ils se voient régulièrement depuis plusieurs mois. Quand elle s'absente, ils s'écrivent régulièrement, se téléphonent tous les soirs. Parfois même, ils s'appellent la nuit. Quand elle revient, ils se rencontrent au café de la Gare où ils s'attendent et, de peur d'être en retard, ils se dépêchent tous les deux.","gradable":false,"blanks":[],"verification":null,"match":null,"answers":{"confidence":"reference","explanation":null,"reference":"Verbes non réciproques : s’absente, se dépêchent."}}]},{"id":"12-e04b","label":"4","suffix":"b","type":"transformation","instruction":"Puis réécrivez ce texte au passé et faites les accords si nécessaire.","context":null,"word_bank":null,"gradable":false,"section":"LA FORME PRONOMINALE","items":[{"id":"12-e04b.1","context":null,"prompt":"Ils se voient régulièrement depuis plusieurs mois. Quand elle s'absente, ils s'écrivent régulièrement, se téléphonent tous les soirs. Parfois même, ils s'appellent la nuit. Quand elle revient, ils se rencontrent au café de la Gare où ils s'attendent et, de peur d'être en retard, ils se dépêchent tous les deux.","gradable":false,"blanks":[],"verification":null,"match":null,"answers":{"confidence":"reference","explanation":null,"reference":"Ils se sont vus régulièrement depuis plusieurs mois. Quand elle s'est absentée, ils se sont écrit régulièrement, se sont téléphoné tous les soirs. Parfois même, ils se sont appelés la nuit. Quand elle est revenue, ils se sont rencontrés au café de la Gare où ils se sont attendus et, de peur d'être en retard, ils se sont dépêchés tous les deux."}}]},{"id":"12-e05","label":"5","suffix":null,"type":"fill_blank","instruction":"Complétez avec le verbe au passé composé.","context":null,"word_bank":null,"gradable":true,"section":"LA FORME PRONOMINALE","items":[{"id":"12-e05.1","context":null,"prompt":"Ils (s'en aller) ___ avant le dernier métro.","gradable":true,"blanks":[{"id":"b1","answers":["s'en sont allés"],"choices":["s'en sont allés","s'en est allés","s'en sont allé"]}],"verification":{"status":"verified","note":null},"match":null,"answers":{"confidence":"unanimous","explanation":"« S'en aller » est un verbe pronominal : au passé composé, l'auxiliaire être s'impose et le participe passé s'accorde avec le sujet « ils » (masculin pluriel), d'où « s'en sont allés ».","reference":null}},{"id":"12-e05.2","context":null,"prompt":"Elle (se souvenir) ___ qu'elle avait oublié son parapluie au cinéma.","gradable":true,"blanks":[{"id":"b1","answers":["s'est souvenue"],"choices":["s'est souvenue","s'est souvenu","s'est souvenir"]}],"verification":{"status":"verified","note":null},"match":null,"answers":{"confidence":"unanimous","explanation":"« Se souvenir » est un verbe essentiellement pronominal : il se conjugue avec être au passé composé, et le participe passé s'accorde avec le sujet féminin « elle » (s'est souvenue).","reference":null}},{"id":"12-e05.3","context":null,"prompt":"Elle (se moquer) ___ de sa coupe de cheveux.","gradable":true,"blanks":[{"id":"b1","answers":["s'est moquée"],"choices":["s'est moquée","s'est moqué","se moquée","s'est moquées"]}],"verification":{"status":"verified","note":null},"match":null,"answers":{"confidence":"unanimous","explanation":"« Se moquer de » est un verbe pronominal conjugué avec être au passé composé ; le participe passé s'accorde avec le sujet « elle », ce qui donne « s'est moquée ».","reference":null}},{"id":"12-e05.4","context":null,"prompt":"Elles (se méfier) ___ de ce client, il avait un drôle d'air.","gradable":true,"blanks":[{"id":"b1","answers":["se sont méfiées"],"choices":["se sont méfiées","se sont méfié","se sont méfier"]}],"verification":{"status":"verified","note":null},"match":null,"answers":{"confidence":"unanimous","explanation":"« Se méfier de » est un verbe pronominal : au passé composé on emploie être et on accorde le participe passé avec le sujet féminin pluriel « elles » (se sont méfiées).","reference":null}},{"id":"12-e05.5","context":null,"prompt":"Elles (s'enfuir) ___ en laissant tout derrière elles.","gradable":true,"blanks":[{"id":"b1","answers":["se sont enfuies"],"choices":["se sont enfuies","se sont enfui","se sont enfuir"]}],"verification":{"status":"verified","note":null},"match":null,"answers":{"confidence":"unanimous","explanation":"« S'enfuir » est un verbe pronominal qui prend l'auxiliaire être au passé composé ; le participe passé s'accorde avec le sujet « elles », d'où « se sont enfuies ».","reference":null}}]}]},{"id":"ch13","number":13,"title":"LA FORME IMPERSONNELLE","exercises":[{"id":"13-e01","label":"1","suffix":null,"type":"fill_blank","instruction":"Dans cet article sur la météo, soulignez tous les verbes impersonnels employés pour décrire des phénomènes météorologiques et continuez l'article en vous servant de la carte.","context":null,"word_bank":null,"gradable":false,"section":"LA FORME IMPERSONNELLE","items":[{"id":"13-e01.1"
